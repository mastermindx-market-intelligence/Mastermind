[project]
name = "mastermind"
version = "0.0.1"
description = "Autonomous narrative-investing agent over the macro dashboard engine"
requires-python = ">=3.11"
dependencies = [
    # the engine library (vendored submodule) needs these:
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml",
    "numpy",
    # the bot runtime adds:
    "anthropic>=0.40",
    "claude-agent-sdk>=0.2",   # drives Claude Code CLI as the LLM reasoning layer
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
    "reportlab>=4.0",          # on-the-spot research-paper PDF generation (no system deps)
    "apscheduler>=3.10",
    "psycopg[binary]>=3.1",
    "duckdb>=1.0",
    "httpx>=0.27",
    # live native-currency marks for US/HK books; without this the HK feed
    # health gate cannot distinguish an undeployed feed from a usable snapshot.
    "yfinance==1.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    # The MCP SDK is isolated to integrations/*/server.py and auth edge modules.
    # It is deliberately not a base dependency: control_plane must remain
    # importable in the sealed Executive runtime without the SDK installed.
    # 1.28.1 is the maintained security-fix release on the v1 API line used by
    # current Executive, Secretary, Company Dialogue, and Business app code.
    "mcp==1.28.1",
    # Exact current security-reviewed JWT implementation for hermetic A1 tests.
    "PyJWT[crypto]==2.13.0",
]

# Isolated installation profile for remote Business MCP app/resource-server
# processes. This does not arm, publish, authenticate, or install an app.
business-mcp = [
    "mcp==1.28.1",
    "PyJWT[crypto]==2.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "app",
    "bot",
    "brain",
    "bridge",
    "common",
    "control_plane",
    "data_layer",
    "integrations*",
    "loop",
    "portfolio",
    "scripts*",
]
namespaces = false

[tool.pytest.ini_options]
filterwarnings = ["ignore::Warning"]
addopts = "-q"
testpaths = ["tests"]          # never recurse into vendor/macro's own test suite

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
