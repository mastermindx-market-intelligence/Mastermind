<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MASTERMIND — Market View</title>

<!-- No-flash theme init — MUST be first, before stylesheets (mirrors index.html). -->
<script>
try {
  document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
  document.documentElement.setAttribute('data-lang', localStorage.getItem('lang') || 'en');
} catch(e) {}
</script>

<link rel="stylesheet" href="/theme.css">

<style>
* { box-sizing: border-box; }

body.page-mv {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.55 var(--font-sans);
  margin: 0;
  padding: 18px;
}
@media (min-width: 1100px) {
  body.page-mv { padding: 26px max(40px, calc((100vw - 1280px) / 2)); }
}

body.page-mv a { text-decoration: none; color: var(--link); }

.mv-head { display: flex; align-items: baseline; justify-content: space-between;
  gap: 14px; flex-wrap: wrap; margin: 0 0 18px; }
.mv-head h1 { font-size: 19px; margin: 0; letter-spacing: .01em; }
.mv-head .sub { color: var(--muted); font-size: 12px; }

body.page-mv h2 {
  font-size: 11px; margin: 0 0 12px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .08em; font-weight: 700;
  padding-bottom: 8px; border-bottom: 1px solid var(--line);
}

.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 16px 18px; margin: 0 0 16px;
}

/* ── label-vs-planes banner ─────────────────────────────────────────────── */
.banner { border-radius: 12px; padding: 14px 16px; margin: 0 0 16px;
  border: 1px solid var(--line); background: var(--panel2); }
.banner.conflict {
  --c: var(--act);
  border-color: color-mix(in srgb, var(--c) 45%, var(--line));
  background: color-mix(in srgb, var(--c) 10%, var(--panel));
}
.banner.agree { --c: var(--ok);
  border-color: color-mix(in srgb, var(--c) 32%, var(--line));
  background: color-mix(in srgb, var(--c) 7%, var(--panel)); }
.banner.unconfirmed { --c: var(--warn);
  border-color: color-mix(in srgb, var(--c) 38%, var(--line));
  background: color-mix(in srgb, var(--c) 8%, var(--panel)); }
.banner .bx-title { font-weight: 700; font-size: 14px; margin: 0 0 4px;
  color: color-mix(in srgb, var(--c, var(--muted)) 82%, var(--text)); }
.banner .bx-detail { font-size: 13px; color: var(--text); }
.banner .bx-detail b { color: color-mix(in srgb, var(--c, var(--muted)) 82%, var(--text)); }

/* ── direction / status pills ────────────────────────────────────────────── */
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 700; letter-spacing: .02em; line-height: 1.5;
  border: 1px solid color-mix(in srgb, var(--c, var(--muted)) 30%, transparent);
  background: color-mix(in srgb, var(--c, var(--muted)) 15%, var(--panel));
  color: color-mix(in srgb, var(--c, var(--muted)) 82%, var(--text)); }
.pill.risk_off { --c: var(--act); }
.pill.risk_on  { --c: var(--ok); }
.pill.neutral  { --c: var(--muted); }
.pill.none     { --c: var(--muted); opacity: .6; }
.pill.validated { --c: var(--info); }
.pill.advisory  { --c: var(--muted); }
.pill.stale     { --c: var(--warn); }

/* ── planes table ────────────────────────────────────────────────────────── */
table.mv-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.mv-tbl th { text-align: left; color: var(--muted); font-weight: 600;
  font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
  padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.mv-tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line);
  vertical-align: top; }
table.mv-tbl tr:last-child td { border-bottom: none; }
table.mv-tbl tr.absent td { opacity: .5; }
.mv-name { font-weight: 600; white-space: nowrap; }
.mv-name .src { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
.mv-reading { color: var(--text); max-width: 520px; }
.mv-reading.muted { color: var(--muted); font-style: italic; }
.mv-fresh { white-space: nowrap; color: var(--muted); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }

.auction-context .pair { overflow-wrap: anywhere; }
.auction-context details { margin: 10px 0; }
.auction-context summary { cursor: pointer; color: var(--muted); }
.auction-context h3 { font-size: 13px; margin: 16px 0 8px; }
body.page-mv .auction-context .brief-row > details { grid-column: 1 / -1; }

/* ── rotation pairs ──────────────────────────────────────────────────────── */
.pairs { display: grid; gap: 8px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .pairs { grid-template-columns: 1fr 1fr; } }
.pair { background: var(--panel2); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 12px; font-size: 13px; }
.pair .lead { font-weight: 700; }
.pair .arrow { color: var(--muted); margin: 0 5px; }
.pair .metric { color: var(--muted); font-size: 12px; margin-top: 3px;
  font-variant-numeric: tabular-nums; }
.pair.accel { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }

.brief-row { margin: 0 0 12px; }
.brief-row:last-child { margin-bottom: 0; }
.brief-row .k { color: var(--muted); font-size: 11px; text-transform: uppercase;
  letter-spacing: .05em; font-weight: 700; margin: 0 0 3px; }
.brief-row .v { color: var(--text); font-size: 13px; }

.tilt-strip { display: flex; gap: 18px; flex-wrap: wrap; margin: 0 0 4px; }
.tilt-strip .kv { font-size: 13px; }
.tilt-strip .kv .k { color: var(--muted); }
.tilt-strip .kv .v { font-weight: 700; }

.msg { color: var(--muted); padding: 30px 0; text-align: center; }
.footnote { color: var(--muted); font-size: 11px; margin-top: 10px; }

/* Institutional perception workstation. */
body.page-mv {
  --mv-hair: color-mix(in srgb, var(--line) 72%, transparent);
  --mv-tile: color-mix(in srgb, var(--panel2) 86%, var(--panel));
  min-height: 100vh;
  padding: 22px clamp(18px, 3vw, 48px) 72px;
}
@media (min-width: 1360px) {
  body.page-mv { padding-inline: calc((100vw - 1280px) / 2); }
}
body.page-mv #mv-root { display: grid; gap: 18px; }
body.page-mv .panel {
  min-width: 0;
  margin: 0;
  padding: 20px 22px;
  border-color: var(--line);
  border-radius: 15px;
  background: var(--panel);
  box-shadow: var(--card-shadow);
}
body.page-mv .panel > h2 {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 16px;
  padding: 0 0 13px;
  border-bottom: 1px solid var(--line);
  color: var(--text);
  font-size: 16px;
  font-weight: 740;
  line-height: 1.3;
  letter-spacing: -.012em;
  text-transform: none;
}
body.page-mv .panel > h2::before {
  content: "";
  width: 3px;
  height: 18px;
  flex: none;
  border-radius: 2px;
  background: linear-gradient(180deg, var(--info),
    color-mix(in srgb, var(--info) 28%, transparent));
}
body.page-mv .banner {
  position: relative;
  overflow: hidden;
  margin: 0;
  padding: 17px 18px 17px 20px;
  border-radius: 13px;
  box-shadow: var(--card-shadow);
}
body.page-mv .banner::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  background: var(--c, var(--info));
}
body.page-mv .banner .bx-title { font-size: 13.5px; }
body.page-mv .banner .bx-detail { color: color-mix(in srgb, var(--text) 72%, transparent); line-height: 1.55; }
body.page-mv .pill {
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: .045em;
}
body.page-mv .tilt-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
body.page-mv .tilt-strip .kv {
  min-height: 60px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  padding: 10px 12px;
  border: 1px solid var(--mv-hair);
  border-radius: 9px;
  background: var(--mv-tile);
}
body.page-mv .tilt-strip .kv .k {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
}
body.page-mv .tilt-strip .kv .v { font-family: var(--font-mono); }
body.page-mv .mv-table-scroll {
  border: 1px solid var(--mv-hair);
  border-radius: 10px;
  overflow: auto;
  overscroll-behavior-inline: contain;
  -webkit-overflow-scrolling: touch;
}
body.page-mv table.mv-tbl { min-width: 880px; font-size: 12.5px; }
body.page-mv table.mv-tbl th {
  padding: 10px;
  background: color-mix(in srgb, var(--panel2) 58%, transparent);
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .075em;
}
body.page-mv table.mv-tbl td { padding: 11px 10px; border-bottom-color: var(--mv-hair); }
body.page-mv table.mv-tbl tbody tr:hover > td {
  background: color-mix(in srgb, var(--info) 5%, transparent);
}
body.page-mv .num,
body.page-mv .mv-fresh,
body.page-mv .pair .metric { font-family: var(--font-mono); }
body.page-mv .pairs { gap: 9px; }
body.page-mv .pair {
  padding: 12px 13px;
  border-color: var(--mv-hair);
  border-radius: 10px;
  background: var(--mv-tile);
}
body.page-mv .brief-row {
  display: grid;
  grid-template-columns: 170px minmax(0, 1fr);
  gap: 18px;
  margin: 0;
  padding: 11px 0;
  border-bottom: 1px solid var(--mv-hair);
}
body.page-mv .brief-row:last-child { border-bottom: 0; }
body.page-mv .brief-row .k {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: .075em;
}
body.page-mv .brief-row .v { color: color-mix(in srgb, var(--text) 76%, transparent); line-height: 1.55; }
body.page-mv .msg {
  min-height: 120px;
  display: grid;
  place-content: center;
  padding: 24px;
  border: 1px dashed var(--mv-hair);
  border-radius: 11px;
}
body.page-mv .footnote {
  margin: 0;
  padding-top: 4px;
  font-family: var(--font-mono);
  line-height: 1.55;
}
@media (max-width: 820px) {
  body.page-mv {
    padding:
      calc(14px + env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      calc(56px + env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
  }
  body.page-mv .panel { padding: 17px 14px; border-radius: 13px; }
  body.page-mv .tilt-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  body.page-mv .brief-row { grid-template-columns: 1fr; gap: 4px; }
  body.page-mv :is(.banner, .brief-row .v, .mm-page-note) { overflow-wrap: anywhere; }
}
</style>
</head>
<body class="page-mv">

<header class="mm-product-bar">
  <a class="mm-product-brand" href="/" aria-label="Mastermind Dashboard">
    <svg class="mm-product-mark" viewBox="0 0 32 32" aria-hidden="true">
      <defs><linearGradient id="mv-logo-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#7c5cff"/>
      </linearGradient></defs>
      <rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="url(#mv-logo-grad)"/>
      <path d="M8 22.5 V11 L16 18.5 L24 11 V22.5" fill="none" stroke="#fff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="mm-product-word">MASTERMIND</span>
  </a>
  <span class="mm-product-context">Perception</span>
  <nav class="mm-product-links" aria-label="Product">
    <a href="/">Bot Dashboard</a>
    <a href="/portfolio_desk">Manual Ledger</a>
    <a href="/market_view" aria-current="page">Market View</a>
    <a href="/agenda">Agenda</a>
  </nav>
</header>

<div class="mm-page-heading">
  <div>
    <div class="mm-page-kicker">Deterministic market synthesis</div>
    <h1>Market View <span class="pill validated" style="vertical-align:middle">PERCEPTION</span></h1>
    <div class="sub" id="mv-sub">loading the one view…</div>
  </div>
  <p class="mm-page-note">One read-only view of validated signal planes, disagreements, and posture implications.</p>
</div>

<div id="mv-root">
  <div class="msg">Loading market_view.v1 artifact…</div>
</div>

<script>
(function () {
  "use strict";

  var root = document.getElementById("mv-root");
  var sub = document.getElementById("mv-sub");

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function fmtNum(v, digits) {
    if (v === null || v === undefined || v === "") return "—";
    var n = Number(v);
    if (!isFinite(n)) return esc(v);
    return n.toFixed(digits == null ? 3 : digits);
  }

  function dirPill(d) {
    var cls = (d === "risk_off" || d === "risk_on" || d === "neutral") ? d : "none";
    return '<span class="pill ' + cls + '">' + esc(d || "—") + "</span>";
  }

  function statusPill(rec) {
    var stale = rec.freshness && rec.freshness.stale;
    var present = !(rec.raw && (
      rec.raw.artifact_present === false ||
      (rec.raw.artifact_present == null && rec.raw.present === false)
    ));
    if (!present) return '<span class="pill none">absent</span>';
    var s = rec.status || "advisory";
    var html = '<span class="pill ' + esc(s) + '">' + esc(s) + "</span>";
    if (stale) html += ' <span class="pill stale">stale</span>';
    return html;
  }

  function freshCell(rec) {
    var f = rec.freshness || {};
    if (f.asof == null) return '<span class="mv-fresh">—</span>';
    var age = (f.age_sessions == null) ? "?" : f.age_sessions;
    return '<span class="mv-fresh">' + esc(f.asof) + " · " + esc(age) + "s</span>";
  }

  // ── label-vs-planes banner ────────────────────────────────────────────────
  function renderBanner(view) {
    var lvp = view.label_vs_planes || {};
    var conflict = !!lvp.conflict;
    var relationship = lvp.relationship || (conflict ? "conflict" : "unconfirmed");
    var floor = !!view.posture_floor_defense;
    var cls = conflict ? "conflict" : (
      relationship === "confirmed" ? "agree" : "unconfirmed"
    );
    var title, detail;
    if (conflict) {
      var diss = (lvp.dissenting_planes || []).join(", ") || "—";
      title = "LABEL vs PLANES — CONFLICT";
      detail = "The regime label reads <b>" + esc(lvp.label_direction) +
        "</b> while the validated-plane consensus reads <b>" +
        esc(lvp.plane_consensus_direction) + "</b> (magnitude " +
        fmtNum(lvp.magnitude, 3) + "). Dissenting validated planes: <b>" + esc(diss) + "</b>." +
        (floor ? " Perception warrants a <b>defensive floor</b> (shrink-only)." : "");
    } else if (relationship === "confirmed") {
      title = "LABEL vs PLANES — CONFIRMED";
      detail = "Label (<b>" + esc(lvp.label_direction) + "</b>) and the validated-plane consensus (<b>" +
        esc(lvp.plane_consensus_direction) + "</b>) agree.";
    } else if (relationship === "unconfirmed") {
      title = "LABEL vs PLANES — UNCONFIRMED";
      detail = "The regime label reads <b>" + esc(lvp.label_direction) +
        "</b>, but validated-plane consensus is <b>" +
        esc(lvp.plane_consensus_direction || "absent") +
        "</b>. Neutral or balanced evidence is an abstention, not confirmation.";
    } else {
      title = "LABEL vs PLANES — unavailable";
      detail = "The regime label or validated-plane consensus is unavailable; no agreement is inferred.";
    }
    return '<div class="banner ' + cls + '"><div class="bx-title">' + esc(title) +
      '</div><div class="bx-detail">' + detail + "</div></div>";
  }

  // ── net posture tilt strip ────────────────────────────────────────────────
  function renderTilt(view) {
    var t = view.net_posture_tilt || {};
    var a = view.assembly || {};
    var kvs = [
      ["Tilt", dirPill(t.direction) + ' <span class="num">' + fmtNum(t.tilt, 3) + "</span>"],
      ["Validated planes", '<span class="num">' + (t.n_validated == null ? "—" : t.n_validated) + "</span>"],
      ["Decision coverage", '<span class="num">' + fmtNum(a.decision_coverage, 3) + "</span>"],
      ["Coherence", '<span class="num">' + fmtNum(view.coherence, 3) + "</span>"],
      ["Availability", '<span class="num">' + fmtNum(view.coverage, 3) + "</span>"],
      ["Fresh coverage", '<span class="num">' + fmtNum(a.fresh_coverage, 3) + "</span>"]
    ];
    var out = '<div class="tilt-strip">';
    kvs.forEach(function (kv) {
      out += '<div class="kv"><span class="k">' + esc(kv[0]) + ':</span> <span class="v">' + kv[1] + "</span></div>";
    });
    out += "</div>";
    out += '<div class="footnote">Contributors: ' + esc((t.contributors || []).join(", ") || "none") +
      " · assembly " + (a.present || 0) + "/" + (a.total || 0) + " present, " +
      (a.fresh || 0) + " fresh, " + (a.stale || 0) + " stale, " + (a.missing || 0) + " missing" +
      (a.degraded ? " · <b>DEGRADED</b> (may only refuse to loosen)" : "") + "</div>";
    return out;
  }

  // ── planes table ──────────────────────────────────────────────────────────
  var PLANE_ORDER = [
    "risk_radar", "mtf_signals", "froth_fragility", "gross_factor", "turning_point",
    "vol_shock", "cross_asset", "market_drivers", "dislocation", "macro_risk",
    "cycles", "distribution_tells", "liquidity_quality", "regime_nowcast",
    "rotation_tensor", "anticipation", "rrg", "group_flow", "event_calendar", "intl_spillover"
  ];

  function renderPlanes(view) {
    var planes = view.planes || {};
    // preserve the artifact's own plane order, falling back to the canonical order.
    var names = Object.keys(planes);
    if (!names.length) names = PLANE_ORDER;
    var rows = "";
    names.forEach(function (name) {
      var rec = planes[name];
      if (!rec) return;
      var present = !(rec.raw && (
        rec.raw.artifact_present === false ||
        (rec.raw.artifact_present == null && rec.raw.present === false)
      ));
      var reading = rec.reading;
      var readingHtml = (reading == null || reading === "")
        ? '<span class="mv-reading muted">' + (present ? "—" : esc((rec.raw && rec.raw.note) || "absent")) + "</span>"
        : '<span class="mv-reading">' + esc(reading) + "</span>";
      var mag = rec.magnitude;
      rows += '<tr class="' + (present ? "" : "absent") + '">' +
        '<td class="mv-name">' + esc(name) +
          '<span class="src">' + esc(rec.source_contract || "") + "</span></td>" +
        "<td>" + readingHtml + "</td>" +
        "<td>" + dirPill(rec.direction) + "</td>" +
        '<td class="num">' + (mag == null ? "—" : fmtNum(mag, 3)) + "</td>" +
        "<td>" + freshCell(rec) + "</td>" +
        "<td>" + statusPill(rec) + "</td>" +
        "</tr>";
    });
    return '<div class="mm-scroll-hint" aria-hidden="true">Swipe horizontally to inspect every signal field</div>' +
      '<div class="mv-table-scroll"><table class="mv-tbl"><thead><tr>' +
      "<th>Plane</th><th>Reading</th><th>Direction</th><th>Magnitude*</th>" +
      "<th>Freshness</th><th>Status</th></tr></thead><tbody>" + rows +
      '</tbody></table></div><div class="footnote">* Magnitudes use each plane’s native scale and ' +
      "must not be compared across rows. Typed units and horizons live in decision_context.v2.</div>";
  }

  // ── deterministic brief ───────────────────────────────────────────────────
  function renderBrief(view) {
    var b = view.brief || {};
    var order = [
      ["what_changed", "What changed"],
      ["whats_rotating", "What's rotating"],
      ["wheres_the_risk", "Where's the risk"],
      ["posture_implication", "Posture implication"]
    ];
    var out = "";
    order.forEach(function (kv) {
      var v = b[kv[0]];
      if (v == null || v === "") return;
      out += '<div class="brief-row"><div class="k">' + esc(kv[1]) + '</div>' +
        '<div class="v">' + esc(v) + "</div></div>";
    });
    return out || '<div class="msg">No brief available.</div>';
  }

  // ── top rotation pairs (from the rotation_tensor plane's raw) ──────────────
  function renderPairs(view) {
    var planes = view.planes || {};
    var rt = planes.rotation_tensor || {};
    var raw = rt.raw || {};
    var pairs = raw.top_pairs;
    // The tensor plane exposes headline_episode; top_pairs may live under raw or headline.
    if (!Array.isArray(pairs)) {
      pairs = (raw.headline_episode && raw.headline_episode.top_pairs) || null;
    }
    if (!Array.isArray(pairs) || !pairs.length) {
      var note = (rt.raw && rt.raw.note) || "rotation_tensor organ not present";
      return '<div class="msg">' + esc(note) + "</div>";
    }
    var out = '<div class="pairs">';
    pairs.slice(0, 8).forEach(function (p) {
      var accel = p.accelerating ? " accel" : "";
      out += '<div class="pair' + accel + '">' +
        '<span class="lead">' + esc(p.lead) + '</span><span class="arrow">&raquo;</span>' +
        esc(p.lag) + (p.accelerating ? ' <span class="pill stale">accelerating</span>' : "") +
        '<div class="metric">R ' + fmtNum(p.R_bps_day, 2) + " bps/day · dR " +
        fmtNum(p.dR_bps_day, 2) + " bps/day</div></div>";
    });
    out += "</div>";
    return out;
  }

  // Independent observed context; outside the stored decision-plane coverage.
  function auctionText(en, zh) {
    return document.documentElement.getAttribute('data-lang') === 'zh' ? zh : en;
  }
  function auctionEsc(value) {
    return esc(value).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function auctionLink(value) {
    try {
      var u = new URL(value);
      if (u.protocol !== 'https:' || u.username || u.password ||
          (u.port && u.port !== '443') ||
          !['treasurydirect.gov', 'www.treasurydirect.gov', 'fiscaldata.treasury.gov',
            'home.treasury.gov', 'treasury.gov', 'www.treasury.gov'].includes(u.hostname)) return '';
      return '<a href="' + auctionEsc(value) + '" target="_blank" rel="noopener noreferrer">' +
        auctionEsc(auctionText('Official source', '官方来源')) + '</a>';
    } catch (e) { return ''; }
  }
  function renderAuctionRow(row) {
    var unknown = auctionText('Unknown', '未知');
    var out = '<div class="pair"><div class="lead">' + auctionEsc(row.label) + '</div>';
    out += '<div class="metric">' + auctionEsc(row.episode_id) + ' · ' + auctionEsc(row.normalized_class) +
      ' · ' + auctionEsc(row.physical_state) + '</div>';
    var lines = [
      [auctionText('Auction date', '拍卖日期'), row.auction_date],
      [auctionText('Issue date', '发行日期'), row.issue_date],
      [auctionText('Competitive deadline (UTC)', '竞标截止时间（UTC）'), row.competitive_deadline_utc],
      [auctionText('Scheduled time (ET)', '计划时间（美东）'), row.time_et],
      [auctionText('Offering amount (USD)', '发行金额（美元）'), row.offering_amount_usd],
      [auctionText('Known at', '获知时间'), row.known_at],
      [auctionText('Source state', '来源状态'), row.source_state],
      [auctionText('Issue calendar state', '发行日历状态'), row.issue_calendar_state]
    ];
    lines.forEach(function (line) {
      out += '<div class="metric">' + auctionEsc(line[0]) + ': ' +
        auctionEsc(line[1] == null ? unknown : line[1]) + '</div>';
    });
    out += '<div class="metric">' + auctionEsc(auctionText('Importance: Not scored', '重要性：未评分')) + ' · ' +
      auctionEsc(row.result == null ? auctionText('Results not observed', '尚未观察到结果') :
        auctionText('Result evidence observed', '已观察到结果证据')) + '</div>';
    if (row.result != null) {
      out += '<details><summary>' + auctionEsc(auctionText('Observed result fields', '已观察的结果字段')) + '</summary>';
      Object.keys(row.result).forEach(function (key) {
        out += '<div class="metric">' + auctionEsc(key) + ': ' +
          auctionEsc(row.result[key] == null ? unknown : row.result[key]) + '</div>';
      });
      out += '</details>';
    }
    if (row.null_reasons && row.null_reasons.length) {
      out += '<div class="metric">' + auctionEsc(auctionText('Unknown reasons', '未知原因')) + ': ' +
        auctionEsc(row.null_reasons.join('; ')) + '</div>';
    }
    out += '<div class="metric">' + auctionLink(row.source_url) + '</div></div>';
    return out;
  }
  function renderAuctions(view) {
    var context = view.sovereign_auction_context;
    var title = auctionText('Sovereign auctions — observed context', '国债拍卖 — 已观察背景');
    var out = '<div class="panel auction-context"><h2>' + auctionEsc(title) + '</h2>';
    out += '<div class="footnote">' + auctionEsc(auctionText(
      'Research only · Not scored · Outside decision-plane coverage · Freshness unassessed',
      '仅供研究 · 未评分 · 不计入决策层覆盖率 · 新鲜度未评估')) + '</div>';
    if (!context) return out + '<div class="msg">' + auctionEsc(auctionText('Unavailable: producer context not published', '不可用：生产方背景未发布')) + '</div></div>';
    out += '<div class="metric">' + auctionEsc(auctionText('Observed at', '观察时间')) + ': ' +
      auctionEsc(context.source_observed_at || auctionText('Unknown', '未知')) + ' · ' +
      auctionEsc(auctionText('Producer cutoff', '生产方截止时间')) + ': ' + auctionEsc(context.decision_cutoff_utc || auctionText('Unknown', '未知')) + '</div>';
    if (context.available !== true) {
      out += '<div class="msg">' + auctionEsc(auctionText('Unavailable', '不可用')) + ': ' +
        auctionEsc(context.note || context.status || auctionText('Unknown', '未知')) + '</div>';
    } else {
      var events = Array.isArray(context.events) ? context.events : [];
      var groups = [
        [auctionText('Scheduled auctions', '计划拍卖'), events.filter(function (r) { return r.physical_state === 'ANNOUNCED'; })],
        [auctionText('Awaiting results', '等待结果'), events.filter(function (r) { return r.physical_state === 'AWAITING_RESULT'; })],
        [auctionText('Tentative calendar', '暂定日历'), events.filter(function (r) { return r.physical_state === 'TENTATIVE'; })],
        [auctionText('Observed results', '已观察结果'), events.filter(function (r) { return r.physical_state === 'RESULT_OBSERVED'; })]
      ];
      out += '<div class="metric">' + auctionEsc(auctionText('Observed episodes', '已观察事件')) + ': ' + auctionEsc(events.length) +
        ' · ' + auctionEsc(auctionText('30-day context; observed counts are not a complete universe', '30天背景；观察数量不代表完整范围')) + '</div>';
      groups.forEach(function (group) {
        var rows = group[1];
        if (!rows.length) return;
        var initial = 5;
        out += '<div class="brief-row"><h3>' + auctionEsc(group[0]) + ' (' + auctionEsc(rows.length) + ')</h3><div class="pairs">';
        rows.slice(0, initial).forEach(function (row) { out += renderAuctionRow(row); });
        out += '</div>';
        if (rows.length > initial) {
          out += '<details><summary>' + auctionEsc(auctionText('Show remaining', '显示其余')) + ' ' +
            auctionEsc(rows.length - initial) + '</summary><div class="pairs">';
          rows.slice(initial).forEach(function (row) { out += renderAuctionRow(row); });
          out += '</div></details>';
        }
        out += '</div>';
      });
      if (!events.length) out += '<div class="msg">' + auctionEsc(auctionText('No episodes in observed coverage; future unannounced auctions remain unknown', '观察范围内无事件；未来未公告拍卖仍未知')) + '</div>';
    }
    (context.source_health || []).forEach(function (source) {
      out += '<div class="footnote">' + auctionLink(source.source_url) + ' · ' + auctionEsc(source.source_kind) + ' · ' +
        auctionEsc(auctionText('Latest attempt', '最近尝试')) + ': ' + auctionEsc(source.latest_attempt_at) + ' (' +
        auctionEsc(source.latest_attempt_status) + ') · ' + auctionEsc(auctionText('Last valid observation', '最近有效观察')) + ': ' +
        auctionEsc(source.last_valid_observation_at || auctionText('Unknown', '未知')) + ' · ' +
        auctionEsc(auctionText('Age at cutoff (seconds)', '截止时年龄（秒）')) + ': ' +
        auctionEsc(source.last_valid_observation_age_seconds == null ? auctionText('Unknown', '未知') : source.last_valid_observation_age_seconds) +
        ' · ' + auctionEsc(auctionText('Freshness unassessed', '新鲜度未评估')) +
        (source.latest_failure_at ? ' · ' + auctionEsc(auctionText('Last failed attempt', '最近失败尝试')) + ': ' +
          auctionEsc(source.latest_failure_at) + ' · ' + auctionEsc((source.latest_failure_reasons || []).join('; ')) : '') + '</div>';
    });
    var failures = (context.quarantine || []).concat(context.conflicts || []);
    if (failures.length) out += '<details><summary>' + auctionEsc(auctionText('Producer exclusions/conflicts', '生产方排除／冲突')) +
      ' (' + auctionEsc(failures.length) + ')</summary><div class="footnote">' +
      failures.map(function (r) { return auctionEsc(r.reason); }).join('<br>') + '</div></details>';
    return out + '</div>';
  }

  function render(view) {
    sub.textContent = "region " + (view.region || "us") + " · asof " +
      (view.asof || "—") + " · seq " + (view.seq == null ? 0 : view.seq) +
      " · " + (view.schema_version || "");
    var html = "";
    html += renderBanner(view);
    html += '<div class="panel"><h2>Net Posture Tilt (validated planes only)</h2>' +
      renderTilt(view) + "</div>";
    html += '<div class="panel"><h2>Planes</h2>' + renderPlanes(view) + "</div>";
    html += renderAuctions(view);
    html += '<div class="panel"><h2>Brief (deterministic — zero LLM)</h2>' + renderBrief(view) + "</div>";
    html += '<div class="panel"><h2>Top Rotation Pairs</h2>' + renderPairs(view) + "</div>";
    html += '<div class="footnote">Read-only mirror of data/market_view/latest.json. This view sizes ' +
      "nothing (W-E wave contract: zero behavior change).</div>";
    root.innerHTML = html;
  }

  fetch("/api/market_view", { headers: { "Accept": "application/json" } })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
    .then(function (res) {
      if (!res.ok || (res.body && res.body.available === false)) {
        var note = (res.body && (res.body.note || res.body.error)) || "market view unavailable";
        root.innerHTML = '<div class="msg">' + esc(note) + "</div>";
        sub.textContent = "unavailable";
        return;
      }
      render(res.body);
    })
    .catch(function (e) {
      root.innerHTML = '<div class="msg">Failed to load market view: ' + esc(e && e.message) + "</div>";
      sub.textContent = "error";
    });
})();
</script>

</body>
</html>
