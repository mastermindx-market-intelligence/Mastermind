const kinds = new Set(['product_scope','prerequisite','observation','return_path','user_journey','consumption']);
function compose(inputNodes, inputRelations) {
  const refuse = () => { throw new Error('INVALID_DESIGN_RELATIONSHIPS'); };
  if (!Array.isArray(inputNodes) || !Array.isArray(inputRelations) || inputNodes.length !== 6 || inputRelations.length > 16) refuse();

  const cards = inputNodes.map(n => {
    if (!n || typeof n.id !== 'string' || !Object.hasOwn(positions,n.id) || seen.has(n.id)) refuse();

    for (const key of ['title','kind','owner','needs','source']) if (typeof n[key] !== 'string' || !n[key] || n[key].length > 300) refuse();

  const byId = new Map(cards.map(n => [n.id,n]));

      end = {x:to.x+(right?0:to.width),y:to.y+to.height/2};

      path = `M ${start.x} ${start.y} C ${mid} ${start.y}, ${mid} ${end.y}, ${end.x} ${end.y}`;

      const down = from.y < to.y;
      start = {x:from.x+from.width/2,y:from.y+(down?from.height:0)};
      end = {x:to.x+to.width/2,y:to.y+(down?0:to.height)};
      const mid = (start.y+end.y)/2;
      path = `M ${start.x} ${start.y} C ${start.x} ${mid}, ${end.x} ${mid}, ${end.x} ${end.y}`;
    }

function render(focus=true){main.replaceChildren();const r=route();const [state]=scenarioText();byId('ref-state').textContent=state;byId('ref-note').textContent=scenario==='recorded'?'Checkpoint '+snapshot+' · not a live status feed':'Presentation-only failure rehearsal · no real effect';document.querySelectorAll('.nav button').forEach(b=>{const active=b.dataset.route===r||(b.dataset.route==='program'&&['workspace','connections','evidence'].includes(r));b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});byId('crumb').textContent='Workspace / '+({today:'Today',program:'Mastermind OS',workspace:'Execution Fabric',connections:'Connections',evidence:'Evidence',ask:'Ask Sol',advanced:'Advanced'}[r]);if(scenario!=='recorded')add(main,statusNotice());renderers[r]();add(main,footer());if(focus)focusConnected(main.querySelector('h1'),null,{preventScroll:true});}
byId('scenario').addEventListener('change',e=>{scenario=['recorded','source_missing','effect_unknown','corrected'].includes(e.target.value)?e.target.value:'recorded';render(false);});
byId('close-inspector').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>{focusConnected(returnFocus,main.querySelector('h1'));returnFocus=null;});
byId('search').addEventListener('input',e=>{const q=e.target.value.slice(0,300);const result=byId('search-results');result.replaceChildren();if(!q.trim())return;const matches=sources.filter(s=>(s.title+' '+s.ref+' '+s.owner).toLowerCase().includes(q.toLowerCase()));if(!matches.length)add(result,p('No recorded item matches “'+q+'”.'));else matches.slice(0,7).forEach(s=>add(result,button(s.title,()=>{inspectSource(s,byId('search'));result.replaceChildren();},'')));});
byId('search').addEventListener('keydown',e=>{if(e.key==='Escape'){byId('search-results').replaceChildren();byId('search').value='';}});
document.querySelectorAll('.nav button').forEach(b=>{b.addEventListener('click',()=>go(b.dataset.route));const icon=document.createElementNS('http://www.w3.org/2000/svg','svg');icon.setAttribute('viewBox','0 0 24 24');icon.setAttribute('aria-hidden','true');const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',icons[b.dataset.route]||icons.program);icon.append(path);b.prepend(icon);});
document.querySelector('.skip').addEventListener('click',event=>{event.preventDefault();focusConnected(main.querySelector('h1'),null);});
window.addEventListener('hashchange',()=>render(true));render(false);
})();
</script></body></html>
