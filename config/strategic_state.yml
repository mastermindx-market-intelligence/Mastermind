# config/strategic_state.yml — what the company is currently trying to accomplish.
#
# DOCUMENTATION-AS-CONFIG (same contract as config/authority_map.yml): this file is
# both the human-readable statement of company strategy and the machine-verifiable
# table that tests/test_strategic_state.py asserts over.
#
# SOURCE LAW: research/MASTERMIND_CHARTER_V2.md is the constitution and outranks this
# file. The charter states the PERMANENT principles (P1-P10); this file states the
# CURRENT objective set. Where they conflict, the charter wins and this file is
# amended — never the reverse. Charter P7 (one source of truth per concept) is why
# this is the only file that answers "what is the company working on right now."
#
# WHAT THIS FILE IS NOT. It is not a control plane, a scheduler, or a job queue, and
# no runtime behavior keys off it. control_plane/ owns job governance,
# config/authority_map.yml owns the A0-A7 authority ladder, config/agents.yml owns
# seats and model routing, and domain ranking systems own their own candidate queues.
# Wiring an execution path that reads this file to decide what to RUN would create a
# second control plane — prohibited by `constraints` below.
#
# WHO EDITS IT. The Chairman or the AI CEO seat, as a recorded decision. A worker
# session may NOT rewrite the objective set to match whatever it happens to be
# building; that is the reinterpretation failure the executive contract forbids.
#
# P0 ID STABILITY. Historical P0 IDs are retired, never renamed or deleted. The active
# set is the current company portfolio; retired rows preserve provenance for Jobs,
# decisions, handoffs, and evidence created under an older strategy.

schema: mastermind.strategic_state.v1

meta:
  title: Mastermind-X company strategic state
  canonical_home: mastermind
  authority: advisory_and_orientation_only
  as_of: 2026-09-26
  charter: research/MASTERMIND_CHARTER_V2.md
  contract: AGENTS.md
  origin: research/EXECUTIVE_OS_PHASE0_CENSUS.md
  maintenance: >
    Change this file only when company strategy actually changes — a P0 is added,
    retired, or re-scoped, a phase gate is amended, or a review trigger fires.
    Live PR state, per-task priorities, and evidence belong in their existing owners,
    not here.

departments: [prophet, product, marketing, executive]
statuses: [active, paused, achieved, retired]
constraint_levels: [permitted, constrained, prohibited]

company_phase: PRE_REVENUE_LAUNCH_CONVERGENCE

north_star:
  - >
    Turn differentiated, trustworthy market intelligence into recurring customer
    value and durable revenue without weakening evidence, uncertainty, correction,
    or paper-only boundaries.
  - >
    Make Prophet, Macro Dashboard, Sector Intelligence, Research Vault, Terminal,
    and Options Intelligence production-ready, interoperable, and valuable enough
    that the combined product is sellable.
  - >
    Deliver one coherent premium desktop/mobile experience whose navigation and
    state flow make the intelligence feel like one investment desk, not a collection
    of unrelated tools.
  - >
    Establish a repeatable acquisition -> activation -> retention -> revenue loop
    and let distribution become the dominant company bias after the SELL_READY gate.
  - >
    Use governed AI autonomy as a force multiplier for product, research, and growth;
    autonomy infrastructure is a means to company throughput, not an endless product
    category of its own.

p0:
  - id: CORE_INTELLIGENCE_PRODUCTIZATION
    department: product
    objective: >
      Bring Prophet, Macro Dashboard, Sector Intelligence, Research Vault, Terminal,
      and Options Intelligence to measured production-ready, sellable states. Maximize
      end-user decision value, frequency of useful use, differentiation, trust, and
      cross-product compounding; connect them into a Market -> Sector -> Opportunity
      -> Security -> Thesis -> Positioning workflow. New product-category expansion
      stays constrained until SELL_READY unless it directly closes a measured core gap.
    status: active

  - id: PREMIUM_PRODUCT_EXPERIENCE
    department: product
    objective: >
      Unify customer-facing Mastermind into one fast, premium, user-friendly
      desktop/mobile product with a coherent design language, information architecture,
      navigation model, state continuity, accessibility, and real-path acceptance.
      Remove dead ends, inconsistent UX/CSS, AI-generated residue, and slow or confusing
      mobile paths rather than polishing isolated screens in place.
    status: active

  - id: DISTRIBUTION_AND_REVENUE
    department: marketing
    objective: >
      Build the commercial spine and distribution foundations now: signup, onboarding,
      activation, trial, billing, entitlement, conversion, retention and attribution;
      product-led shareability; creator, affiliate and partnership channels; and
      high-velocity AI-assisted growth experiments. After SELL_READY, shift the
      company resource bias toward distribution. Scale paid acquisition only when
      retained value and contribution economics justify it.
    status: active

  - id: AUTONOMY_FORCE_MULTIPLIER
    department: executive
    objective: >
      Production-prove a governed objective -> decomposition -> routing -> worker
      execution -> independent review/repair -> integration/recovery/continuation loop
      that removes routine Chairman message shuttling, session hunting, watcher repair,
      and account selection. ChatGPT Web is an optional execution surface, not a
      completion dependency. After AUTONOMY_BASELINE passes, autonomy infrastructure
      defaults to maintenance unless a concrete active-P0 blocker requires expansion.
    status: active

  # Historical P0 identities remain for provenance. Their work is not automatically
  # cancelled; ongoing lawful carriers are reviewed/reclassified under the new parent.
  - id: US_PROPHET_ENTRY_TIMING
    department: prophet
    objective: >
      Retired as a company P0 on 2026-09-26 and subsumed by
      CORE_INTELLIGENCE_PRODUCTIZATION. Historical objective: reduce structural
      late-entry behavior in US Prophet without unacceptable false-positive cost.
    status: retired

  - id: PRODUCT_TRUST_COHERENCE
    department: product
    objective: >
      Retired as a company P0 on 2026-09-26 and subsumed by
      PREMIUM_PRODUCT_EXPERIENCE. Historical objective: remove unfinished-product
      signals, inconsistent UX/CSS, dead surfaces, and confusing structure.
    status: retired

  - id: MONETIZATION_AND_ONBOARDING
    department: product
    objective: >
      Retired as a company P0 on 2026-09-26 and subsumed by
      DISTRIBUTION_AND_REVENUE. Historical objective: complete signup, trial, billing,
      entitlement, paywall, activation, analytics, and lifecycle paths for revenue.
    status: retired

  - id: ZERO_TO_ONE_ACQUISITION
    department: marketing
    objective: >
      Retired as a company P0 on 2026-09-26 and subsumed by
      DISTRIBUTION_AND_REVENUE. Historical objective: prove the first repeatable path
      from zero traffic to qualified prospects and paying users.
    status: retired

  - id: EXECUTIVE_OS
    department: executive
    objective: >
      Retired as a company P0 on 2026-09-26 and subsumed by
      AUTONOMY_FORCE_MULTIPLIER. Existing Executive OS remains the canonical lifecycle
      and admission owner; this retirement changes company-priority classification,
      not runtime authority or accepted implementation ownership.
    status: retired

  - id: CHAIRMAN_COGNITION_AUTONOMY
    department: executive
    objective: >
      Retired as a company P0 on 2026-09-26 and subsumed by
      AUTONOMY_FORCE_MULTIPLIER. The existing Meta-CEO Chairman Cognition capability
      and constitutional Chairman boundaries remain intact as subordinate autonomy
      capabilities rather than a separate company objective.
    status: retired

# One common rubric for the six sellable intelligence products. This is a prioritization
# model, not a marketing claim or automated promotion rule. Scores begin as explicit
# hypotheses and are replaced by observed product telemetry and user evidence.
core_product_value_model:
  products:
    - Prophet
    - Macro Dashboard
    - Sector Intelligence
    - Research Vault
    - Terminal
    - Options Intelligence
  dimensions:
    decision_impact_and_time_saved: 0.25
    frequency_of_useful_use: 0.15
    differentiation_vs_alternatives: 0.20
    trust_and_evidence_quality: 0.10
    cross_product_compounding: 0.15
    activation_and_retention_contribution: 0.15
  evidence_rule: >
    Preserve the dimension vector and its evidence; this is a bounded diagnostic for
    the six core products, not a universal company or strategic-option score. Use
    observed behavior, user research, activation/retention telemetry, and real-path
    task outcomes where available. Score usage frequency relative to the product's
    intended job cadence, not raw page views. Mark unmeasured dimensions as hypotheses
    with confidence rather than inventing precision. A weighted summary may support
    within-core-product prioritization but cannot choose across P0s, grant authority,
    or waive production-readiness and evidence/trust failures.
  production_readiness:
    - data correctness, freshness, coverage, and null/failure behavior are explicit
    - desktop and mobile task journeys meet performance and usability acceptance
    - explanations expose source, as-of time, uncertainty, and material limitations
    - the product has a clear recurring user job and instrumentation for that job
    - cross-product handoffs preserve context instead of forcing the user to restart
    - the real production path has acceptance evidence, not only source or CI proof

# Current allocation bias during PRE_REVENUE_LAUNCH_CONVERGENCE. These are planning
# shares, not execution quotas and not authority. The SELL_READY/AUTONOMY_BASELINE
# gates trigger explicit review; they never mutate these weights automatically.
resource_policy:
  core_intelligence_productization: 0.35
  premium_product_experience: 0.25
  distribution_and_revenue: 0.20
  autonomy_force_multiplier: 0.20

# Phase gates are descriptive review checkpoints, not runtime gates. Passing one
# creates a Chairman/CEO portfolio-review obligation; it grants no Job, budget,
# deployment, credential, merge, or trading authority.
phase_gates:
  AUTONOMY_BASELINE:
    purpose: >
      End autonomy-infrastructure critical-path mode once the organization can
      reliably execute and recover governed multi-worker work without routine
      Chairman orchestration.
    criteria:
      - the accepted Autonomy V1 production-proof matrix, or its accepted successor, is satisfied
      - governed decomposition and multi-worker routing are production-proven
      - independent review, bounded repair, and exact parent consumption are proven
      - worker or session failure recovery is proven without routine Chairman shuttling
      - at least one durable non-ChatGPT-Web execution path is production-proven
      - current lifecycle, effect, source-custody, and continuation owners remain singular
    on_pass: >
      Review autonomy allocation downward toward maintenance. New provider, host,
      browser, or orchestration infrastructure must then name the active P0 and
      concrete production limitation it unlocks.

  SELL_READY:
    purpose: >
      Mark the point where Mastermind is coherent and valuable enough to sell, so the
      company can shift from build-dominant launch convergence toward
      distribution-dominant growth.
    criteria:
      - all six core intelligence products clear production-readiness and user-value review
      - premium desktop and mobile cross-product journeys pass real-path acceptance
      - the Market -> Sector -> Opportunity -> Security -> Thesis -> Positioning workflow is coherent
      - signup, onboarding, activation, trial, billing, entitlement, conversion, and analytics are live
      - freshness, sources, uncertainty, corrections, falsifiers, and material limitations are visible
    on_pass: >
      Trigger an explicit Chairman/CEO resource-policy review in which distribution
      becomes the dominant company bias. Do not wait for product perfection; continue
      product work where retention, trust, or measured user value shows a real gap.

constraints:
  new_feature_expansion: constrained
  autonomous_production_deploy: prohibited
  autonomous_live_capital_execution: prohibited
  duplicate_control_planes: prohibited
  marketing_org_expansion_before_distribution_proof: prohibited
  unbounded_autonomous_strategic_modification: prohibited

review_triggers:
  - autonomy_baseline_gate_passed
  - sell_ready_gate_passed
  - commercial_spine_live
  - first_10_paying_users
  - first_90_day_retention_cohort
  - repeatable_distribution_channel_proven
