_metadata:
  major_version: 2
  minor_version: 1

display_information:
  name: Mastermind Slack Archive
  description: Read-only retention archive of accessible Slack history and files to Google Drive.

oauth_config:
  scopes:
    user:
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - im:history
      - im:read
      - mpim:history
      - mpim:read
      - files:read

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  is_hosted: false
