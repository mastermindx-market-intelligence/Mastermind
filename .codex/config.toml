[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
BOT_REASONING_LAYER = "1"

[agents]
# Project-delivery fan-out belongs to the external Executive/COO/Capacity fabric.
# Keep native Codex subagents disabled by default so frontier Codex context is spent
# on the Astra parent. A bounded invocation may opt in only as a pre-effect fallback.
enabled = false
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "high"
