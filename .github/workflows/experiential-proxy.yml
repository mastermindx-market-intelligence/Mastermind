name: Experiential proxy SDK

on:
  pull_request:
    paths:
      - 'ops/native_fabric/experiential_proxy/**'
      - 'tests/test_experiential_proxy.py'
      - '.github/workflows/experiential-proxy.yml'
  push:
    branches: [master]
    paths:
      - 'ops/native_fabric/experiential_proxy/**'
      - 'tests/test_experiential_proxy.py'
      - '.github/workflows/experiential-proxy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experiential-proxy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-compatibility:
    name: native OpenAI SDK and rate-limit suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only the isolated gateway dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r ops/native_fabric/experiential_proxy/requirements.txt \
            'pytest>=8,<10'
      - name: Ensure native SDK is actually installed
        run: python -c 'from openai import AsyncOpenAI; print("Native SDK import verified")'
      - name: Check syntax and run full proxy suite including SDK
        run: |
          python -m compileall -q ops/native_fabric/experiential_proxy
          # Global tests/conftest.py initializes Macro engine fixtures, which
          # this isolated SDK transport suite never uses.
          python -m pytest --noconftest -q tests/test_experiential_proxy.py
