name: Session B Replay and Quarantine Hardening

on:
  push:
    branches:
      - sol/executive-worker-restart-survivability-380-20260918
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: session-b-replay-quarantine-hardening
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout exact source carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sol/executive-worker-restart-survivability-380-20260918

      - name: Checkout pinned Macro engine
        uses: actions/checkout@v4
        with:
          repository: mastermindx-market-intelligence/macro
          ref: 256c757b3c4f0ec759571c29a30a71387d0a18f8
          path: vendor/macro_src
          sparse-checkout: |
            engine
            lib
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply replay and quarantine hardening
        run: python .github/session_b_followup_patch.py

      - name: Compile changed source
        run: |
          python -m py_compile \
            control_plane/worker_execution_contract.py \
            control_plane/worker_adapter.py \
            control_plane/codex_worker.py \
            control_plane/executive_supervisor.py \
            control_plane/executive_worker_broker.py \
            control_plane/executive_service.py

      - name: Run focused adversarial matrix
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_executive_supervisor.py \
            tests/test_executive_codex_worker.py \
            tests/test_executive_worker_broker.py \
            tests/test_executive_service.py \
            -k 'identity_persistence or before_checkpoint or stale_fence or reused_pgid or exactly_replayable or recorded_process_exit or truthful_exit_code or legacy_process_is_quarantined or recovered_cancel or remote_adapter_reattaches or restart_cancel_pending or duplicate_restart_reconcile' \
            2>&1 | tee session-b-followup-focused.log

      - name: Run complete owning regression pack
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_worker_execution_contract.py \
            tests/test_worker_adapter.py \
            tests/test_executive_codex_worker.py \
            tests/test_executive_supervisor.py \
            tests/test_executive_worker_broker.py \
            tests/test_executive_service.py \
            2>&1 | tee session-b-followup-regression.log

      - name: Inspect product delta
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Upload immutable follow-up evidence
        uses: actions/upload-artifact@v4
        with:
          name: session-b-followup-evidence
          path: |
            session-b-followup-focused.log
            session-b-followup-regression.log
          if-no-files-found: error

      - name: Remove generated and temporary files
        run: |
          rm -rf mastermind.egg-info
          rm -f \
            .github/session_b_followup_patch.py \
            .github/workflows/session-b-followup-builder.yml
          rm -f \
            session-b-followup-focused.log \
            session-b-followup-regression.log

      - name: Commit and push exact verified follow-up head
        run: |
          git config user.name "Mastermind Session B Builder"
          git config user.email "session-b-builder@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -q '^mastermind\.egg-info/'; then
            echo "Generated package metadata remains staged"
            exit 1
          fi
          git commit -m "fix(executive): harden restart replay and quarantine"
          git push origin HEAD:sol/executive-worker-restart-survivability-380-20260918
