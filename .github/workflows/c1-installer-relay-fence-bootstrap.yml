name: C1 installer Relay fence bootstrap

on:
  push:
    branches:
      - sol/c1-installer-relay-fence-20260912
    paths:
      - .github/workflows/c1-installer-relay-fence-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: c1-installer-relay-fence-bootstrap
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sol/c1-installer-relay-fence-20260912

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact bootstrap preimage
        shell: bash
        env:
          BASE: 57a2672af5b9dcea282e4bae01d1a0b9d10bb1cd
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git diff --name-only "$BASE"..HEAD)" = ".github/workflows/c1-installer-relay-fence-bootstrap.yml"
          test "$(git hash-object ops/executive_os/install.sh)" = "66d8379da3dcfddae6c01e3b97aabd9c7c5ce741"
          test -z "$(git status --porcelain)"

      - name: Add regression and prove RED on untouched installer
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/test_c1_installer_relay_fence.py <<'PY'
          """Installer must fence the dedicated C1 Relay across generation changes."""
          from __future__ import annotations

          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]
          INSTALL = ROOT / "ops" / "executive_os" / "install.sh"
          RELAY_LABEL = "com.mastermind.executive.sol-state-relay"


          def _slice(source: str, start: str, end: str) -> str:
              start_index = source.index(start)
              end_index = source.index(end, start_index)
              return source[start_index:end_index]


          def test_installer_fences_relay_before_any_release_mutation() -> None:
              source = INSTALL.read_text(encoding="utf-8")
              assert f'RELAY_LABEL="{RELAY_LABEL}"' in source, (
                  "missing dedicated C1 Relay label"
              )

              cleanup = _slice(
                  source,
                  "leave_installed_services_stopped() {",
                  "}\ntrap leave_installed_services_stopped EXIT",
              )
              mutation = _slice(
                  source,
                  "trap leave_installed_services_stopped EXIT",
                  'if [ ! -d "$RELEASE_ROOT" ]; then',
              )
              relay_disable = '/bin/launchctl disable "system/$RELAY_LABEL"'
              control_disable = '/bin/launchctl disable "system/$CONTROL_LABEL"'
              relay_bootout = '/bin/launchctl bootout "system/$RELAY_LABEL"'
              control_bootout = '/bin/launchctl bootout "system/$CONTROL_LABEL"'

              for block in (cleanup, mutation):
                  assert relay_disable in block
                  assert relay_bootout in block
                  assert block.index(relay_disable) < block.index(control_disable)
                  assert block.index(relay_bootout) < block.index(control_bootout)

              relay_loaded = 'print "system/$RELAY_LABEL"'
              control_loaded = 'print "system/$CONTROL_LABEL"'
              assert relay_loaded in mutation
              assert mutation.index(relay_loaded) < mutation.index(control_loaded)
              assert "relay LaunchDaemon remained loaded after bootout" in mutation

              archive = '/usr/bin/git -C "$SOURCE_REPO" archive'
              assert source.index(relay_loaded) < source.index(archive)
              assert 'RELAY_PLIST=' not in source
              assert '/bin/launchctl bootstrap "system/$RELAY_LABEL"' not in source


          if __name__ == "__main__":
              test_installer_fences_relay_before_any_release_mutation()
          PY

          set +e
          python tests/test_c1_installer_relay_fence.py > /tmp/c1-relay-fence-red.log 2>&1
          status=$?
          set -e
          cat /tmp/c1-relay-fence-red.log
          test "$status" -ne 0
          grep -F "missing dedicated C1 Relay label" /tmp/c1-relay-fence-red.log

      - name: Apply minimal production repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("ops/executive_os/install.sh")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'BACKUP_LABEL="com.mastermind.executive.backup"\nCONTROL_USER=',
                  'BACKUP_LABEL="com.mastermind.executive.backup"\n'
                  'RELAY_LABEL="com.mastermind.executive.sol-state-relay"\n'
                  'CONTROL_USER=',
              ),
              (
                  '# and exact-SHA preflight above. From here to process exit the trap keeps both\n'
                  '# old and new daemon definitions disabled and booted out, including on error.\n',
                  '# and exact-SHA preflight above. From here to process exit the trap keeps all\n'
                  '# install-owned daemons, including a separately prepared C1 Relay, disabled\n'
                  '# and booted out across generation mutation and rollback.\n',
              ),
              (
                  'leave_installed_services_stopped() {\n'
                  '  /bin/launchctl disable "system/$CONTROL_LABEL" >/dev/null 2>&1 || true\n',
                  'leave_installed_services_stopped() {\n'
                  '  /bin/launchctl disable "system/$RELAY_LABEL" >/dev/null 2>&1 || true\n'
                  '  /bin/launchctl disable "system/$CONTROL_LABEL" >/dev/null 2>&1 || true\n',
              ),
              (
                  '  /bin/launchctl disable "system/$BACKUP_LABEL" >/dev/null 2>&1 || true\n'
                  '  /bin/launchctl bootout "system/$CONTROL_LABEL" >/dev/null 2>&1 || true\n',
                  '  /bin/launchctl disable "system/$BACKUP_LABEL" >/dev/null 2>&1 || true\n'
                  '  /bin/launchctl bootout "system/$RELAY_LABEL" >/dev/null 2>&1 || true\n'
                  '  /bin/launchctl bootout "system/$CONTROL_LABEL" >/dev/null 2>&1 || true\n',
              ),
              (
                  'trap leave_installed_services_stopped EXIT\n'
                  '/bin/launchctl disable "system/$CONTROL_LABEL"\n',
                  'trap leave_installed_services_stopped EXIT\n'
                  '/bin/launchctl disable "system/$RELAY_LABEL"\n'
                  '/bin/launchctl disable "system/$CONTROL_LABEL"\n',
              ),
              (
                  '/bin/launchctl disable "system/$BACKUP_LABEL"\n'
                  '/bin/launchctl bootout "system/$CONTROL_LABEL" >/dev/null 2>&1 || true\n',
                  '/bin/launchctl disable "system/$BACKUP_LABEL"\n'
                  '/bin/launchctl bootout "system/$RELAY_LABEL" >/dev/null 2>&1 || true\n'
                  '/bin/launchctl bootout "system/$CONTROL_LABEL" >/dev/null 2>&1 || true\n',
              ),
              (
                  '/bin/launchctl bootout "system/$BACKUP_LABEL" >/dev/null 2>&1 || true\n'
                  'if /bin/launchctl print "system/$CONTROL_LABEL" >/dev/null 2>&1; then\n',
                  '/bin/launchctl bootout "system/$BACKUP_LABEL" >/dev/null 2>&1 || true\n'
                  'if /bin/launchctl print "system/$RELAY_LABEL" >/dev/null 2>&1; then\n'
                  '  /bin/echo "relay LaunchDaemon remained loaded after bootout" >&2\n'
                  '  exit 65\n'
                  'fi\n'
                  'if /bin/launchctl print "system/$CONTROL_LABEL" >/dev/null 2>&1; then\n',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"installer preimage mismatch: expected one match, got {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Prove GREEN and adjacent contract
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_c1_installer_relay_fence.py
          bash -n ops/executive_os/install.sh
          python -m pip install -q -e '.[dev]'
          python -m pytest -q \
            tests/test_c1_installer_relay_fence.py \
            tests/test_executive_launchd_config.py
          git diff --check

      - name: Publish final two-path branch tree
        shell: bash
        env:
          BRANCH: sol/c1-installer-relay-fence-20260912
          BASE: 57a2672af5b9dcea282e4bae01d1a0b9d10bb1cd
        run: |
          set -euo pipefail
          git config user.name "Mastermind Web CEO2"
          git config user.email "3@mastermind-x.com"
          git rm .github/workflows/c1-installer-relay-fence-bootstrap.yml
          git add ops/executive_os/install.sh tests/test_c1_installer_relay_fence.py
          git commit -m "fix(c1): fence Relay during Executive install"
          test "$(git diff --name-only "$BASE"..HEAD | sort)" = $'ops/executive_os/install.sh\ntests/test_c1_installer_relay_fence.py'
          git push origin "HEAD:$BRANCH"
