name: Hermes harness

on:
  pull_request:
    paths:
      - 'integrations/hermes_harness/**'
      - 'integrations/hermes_runtime/**'
      - 'integrations/hermes_models/**'
      - 'integrations/hermes_steward/**'
      - 'integrations/hermes_delegate/**'
      - 'integrations/hermes_secretary/**'
      - 'docs/hermes/**'
      - '.github/workflows/hermes-harness.yml'
      - 'requirements/executive-mcp-macos-arm64-py312.in'
      - 'requirements/hermes-transport-observation-test.in'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-offline:
    name: Hermes harness offline stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 1c0cd667746d3395fe9e1b6c74f8f85952486f18
          path: .ci-hermes-native
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the reviewed edge package pins and test runner
        # Reuse package inputs for the real SDK/HTTP fixtures. This Linux test
        # matrix does not attest the production macOS runtime or its hash lock.
        # A private clean venv also gives pinned source the same non-writable
        # custody required by the production observer; ambient toolcache packages
        # may be group-writable and must not weaken that source check.
        run: |
          umask 0022
          harness_test_env="$RUNNER_TEMP/hermes-harness-test"
          python -m venv "$harness_test_env"
          "$harness_test_env/bin/python" -m pip install --disable-pip-version-check -r requirements/executive-mcp-macos-arm64-py312.in -r requirements/hermes-transport-observation-test.in 'pytest==9.1.1'
          echo "$harness_test_env/bin" >> "$GITHUB_PATH"
      - name: Compile the harness and the five packages
        run: python -m compileall -q integrations/hermes_harness integrations/hermes_runtime integrations/hermes_models integrations/hermes_steward integrations/hermes_delegate integrations/hermes_secretary
      - name: Run the offline harness and all five dependency contracts
        env:
          MASTERMIND_HERMES_VENDOR_ROOT: ${{ github.workspace }}/.ci-hermes-native
          HERMES_HOME: ${{ runner.temp }}/hermes-harness-native-fixture
        run: |
          set -eu
          for package in hermes_models hermes_harness hermes_runtime hermes_steward hermes_delegate hermes_secretary; do
            if [ "$package" = hermes_harness ]; then
              python -m pytest -q "integrations/$package/tests" --junitxml="$RUNNER_TEMP/hermes-harness.xml"
              python - "$RUNNER_TEMP/hermes-harness.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          cases = [case for case in ET.parse(sys.argv[1]).iter('testcase')
                   if case.get('classname', '').endswith('.NativePluginLoaderTests')]
          if not cases or any(case.find(tag) is not None for case in cases
                              for tag in ('failure', 'error', 'skipped')):
              raise SystemExit('Pinned Hermes loader cases must execute without failures, errors or skips')
          print(f'Qualified {len(cases)} real pinned Hermes loader cases')
          PY
            elif [ "$package" = hermes_runtime ]; then
              python -m pytest -q "integrations/$package/tests"
            else
              python -m unittest discover -v -s "integrations/$package/tests" -p 'test_*.py'
            fi
          done
