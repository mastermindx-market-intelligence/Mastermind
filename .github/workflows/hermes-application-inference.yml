name: Hermes APPLICATION inference contract

on:
  pull_request:
    paths:
      - 'integrations/hermes_application_fabric/**'
      - 'integrations/hermes_runtime/**'
      - 'integrations/session_bridge/hermes_native.py'
      - 'ops/executive_os/release_manifest.py'
      - 'tests/test_hermes_primary_application_host.py'
      - 'tests/test_hermes_primary_application_tunnel.py'
      - 'tests/test_hermes_primary_session_return.py'
      - 'tests/application_tunnel_ci/**'
      - 'ops/executive_os/application_tunnel_control.py'
      - 'ops/executive_os/os_tunnel_entry.py'
      - '.github/workflows/hermes-application-inference.yml'
  merge_group:
    types: [checks_requested]
  push:
    branches: [master]
    paths:
      - 'integrations/hermes_application_fabric/**'
      - 'integrations/hermes_runtime/**'
      - 'integrations/session_bridge/hermes_native.py'
      - 'ops/executive_os/release_manifest.py'
      - 'tests/test_hermes_primary_application_host.py'
      - 'tests/test_hermes_primary_application_tunnel.py'
      - 'tests/test_hermes_primary_session_return.py'
      - 'tests/application_tunnel_ci/**'
      - 'ops/executive_os/application_tunnel_control.py'
      - 'ops/executive_os/os_tunnel_entry.py'
      - '.github/workflows/hermes-application-inference.yml'

permissions:
  contents: read

jobs:
  native-original-owner:
    name: Hermes native conversation through APPLICATION handler and Broker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 1c0cd667746d3395fe9e1b6c74f8f85952486f18
          path: .ci-hermes-native
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mastermindx-market-intelligence/macro
          ref: d7b6ac402e359f68bee6c670ae975fc86e6ec868
          path: .ci-hermes-application-owner
          sparse-checkout: |
            engine
            lib
            config
          persist-credentials: false
          token: ${{ secrets.MACRO_CI_READ_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install exact native lock and declared overrides
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.13.5'
          uv sync --project .ci-hermes-native --locked --no-default-groups --python 3.14
          uv pip install --python .ci-hermes-native/.venv/bin/python 'jsonschema==4.26.0' 'PyYAML==6.0.3'
      - name: Verify actual native tool history, owner limits and unknown effects
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-original-owner-fixture
          PYTHONPATH: .ci-hermes-native
          HERMES_STARTUP_WARMUP_TIMEOUT: '0'
        run: >-
          .ci-hermes-native/.venv/bin/python -B
          integrations/hermes_application_fabric/qualification/qualify_application_owner.py
          --adapter-root . --macro-root .ci-hermes-application-owner
          --native-owner-root . --hermes-root .ci-hermes-native
  original-tunnel-owner:
    name: Hermes aliases through original tunnel custody
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Qualify original and successor in isolated Linux root fixture
        run: |
          set -euo pipefail
          hermes_transport_source="$(mktemp -d "${RUNNER_TEMP}/hermes-transport-source.XXXXXX")"
          trap 'rm -rf "$hermes_transport_source"' EXIT
          git archive --format=tar HEAD | tar -x -C "$hermes_transport_source"
          chmod 0755 "$hermes_transport_source"
          docker build --file tests/application_tunnel_ci/Dockerfile --tag hermes-transport:${{ github.sha }} tests/application_tunnel_ci
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,mode=1777 --tmpfs /fixture:rw,exec,nosuid,nodev,mode=0755 \
            --mount "type=bind,src=${hermes_transport_source},dst=/repo,readonly" hermes-transport:${{ github.sha }}
  pinned-native-contract:
    name: Hermes pinned v0.23 primary and tools
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 1c0cd667746d3395fe9e1b6c74f8f85952486f18
          path: .ci-hermes-native
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mastermindx-market-intelligence/macro
          ref: d7b6ac402e359f68bee6c670ae975fc86e6ec868
          path: .ci-hermes-application-owner
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /engine/fabric_inference_client.py
          persist-credentials: false
          token: ${{ secrets.MACRO_CI_READ_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install exact native lock and declared overrides
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.13.5'
          uv sync --project .ci-hermes-native --locked --no-default-groups --python 3.14
          uv pip install --python .ci-hermes-native/.venv/bin/python 'jsonschema==4.26.0'
      - name: Qualify current native ABI without an external provider
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-primary-fixture
          PYTHONPATH: .ci-hermes-native
          HERMES_STARTUP_WARMUP_TIMEOUT: '0'
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root = Path.cwd()
          files = {str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
                   for path in (root / 'integrations/hermes_application_fabric').rglob('*')
                   if path.is_file() and '__pycache__' not in path.parts}
          (Path(os.environ['RUNNER_TEMP']) / 'hermes-primary-manifest.json').write_text(
              json.dumps({'candidate': os.environ['GITHUB_SHA'], 'files': files}))
          PY
          .ci-hermes-native/.venv/bin/python -B integrations/hermes_application_fabric/qualification/qualify_installed.py \
            --adapter-root . --owner-root .ci-hermes-application-owner --hermes-root .ci-hermes-native \
            --candidate "$GITHUB_SHA" --manifest "$RUNNER_TEMP/hermes-primary-manifest.json" \
            --hermes-sha 1c0cd667746d3395fe9e1b6c74f8f85952486f18
  native-host-contract:
    name: Hermes primary native host composition
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host fixture dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]' 'jsonschema==4.26.0'
      - name: Verify native admission, source custody and output fences
        run: >-
          python -B -m pytest -q --tb=short --noconftest -o addopts=
          tests/test_hermes_primary_application_host.py
          tests/test_hermes_primary_session_return.py
  original-owner-contract:
    name: Hermes APPLICATION offline contract (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Reuse the repository's existing read-only Macro checkout capability.
      # No provider credentials, installed Hermes profile, or runtime grants.
      - name: Checkout exact APPLICATION client evidence
        uses: actions/checkout@v4
        with:
          repository: mastermindx-market-intelligence/macro
          ref: d7b6ac402e359f68bee6c670ae975fc86e6ec868
          path: .ci-hermes-application-owner
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /engine/fabric_inference_client.py
          persist-credentials: false
          token: ${{ secrets.MACRO_CI_READ_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install qualified JSON validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.26.0'
      - name: Run bounded no-external-network contract suite
        run: >-
          python -B integrations/hermes_application_fabric/qualification/qualify_offline.py
          --owner-root .ci-hermes-application-owner

