name: RWE-P0 shadow gate

# Shadow lane only -- proves the hash-locked rwe_env.py environment reaches
# gate parity with the existing `ci.yml` job. It is never required and never
# replaces `ci.yml`'s own "Install project" / "Run repository test gate"
# steps; that job is completely untouched by this file.
#
# Bootstrap path: the first time this runs with no committed
# requirements/gate-linux-x86_64-py312.lock, it mints one with pip-compile
# and uploads it as an artifact so a maintainer can commit it. Once the lock
# is committed, later runs realize from it instead of minting fresh.

on:
  pull_request:
    paths:
      - "requirements/gate-*.lock"
      - "scripts/rwe_env.py"
      - "scripts/ci_pytest.py"
      - "scripts/ci_parallel_shard.py"
      - "scripts/ci_pytest_timing.py"
      - "scripts/ci_fixed_diagnostics.py"
      - "tests/test_rwe*.py"
      - "tests/test_ci_pytest*.py"
      - ".github/workflows/ci.yml"
      - ".github/workflows/rwe-shadow.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rwe-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # One bootstrap owner supplies identical bytes to all six environments.
      # In the ordinary case this publishes the existing committed lock.
      - name: Mint linux lock (bootstrap only)
        if: hashFiles('requirements/gate-linux-x86_64-py312.lock') == ''
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-tools
          pip-compile --quiet --generate-hashes --extra dev \
            --output-file requirements/gate-linux-x86_64-py312.lock pyproject.toml
      - name: Publish common Linux lock input
        uses: actions/upload-artifact@v4
        with:
          name: rwe-linux-lock
          path: requirements/gate-linux-x86_64-py312.lock
          if-no-files-found: error

  shadow-shards:
    needs: [prepare-lock]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        index: [0, 1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: app/mastermind_os/package-lock.json

      - name: Install Node dependencies
        run: npm ci --prefix app/mastermind_os

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reads the pinned vendored-macro ref straight out of ci.yml's own
      # "Checkout pinned Macro engine" step at runtime (via rwe_env.py's own
      # parser), so this checkout below can never drift from ci.yml's --
      # there is no second copy of the ref to keep in sync by hand.
      - name: Read pinned macro ref from ci.yml
        id: pinned_ref
        run: |
          ref=$(python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from pathlib import Path
          from rwe_env import parse_pinned_ref
          print(parse_pinned_ref(Path('.github/workflows/ci.yml').read_text(encoding='utf-8')))
          ")
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Macro engine
        uses: actions/checkout@v4
        with:
          repository: mastermindx-market-intelligence/macro
          ref: ${{ steps.pinned_ref.outputs.ref }}
          path: vendor/macro_src
          sparse-checkout: |
            engine
            lib
            config
          persist-credentials: false
          token: ${{ secrets.MACRO_CI_READ_TOKEN || github.token }}

      - name: Download the common Linux lock input
        uses: actions/download-artifact@v4
        with:
          name: rwe-linux-lock
          path: requirements

      - name: Realize hash-locked environment
        # Every runner consumes the one prepare-lock artifact above.
        run: python scripts/rwe_env.py realize --dest /tmp/rwe-env

      # Same owned directory and closed diagnostic schema as canonical CI.
      # The canonical shard already loads its fixed timing plugin; no plugin,
      # pytest selector or environment policy is supplied by this workflow.
      - name: Prepare fixed test diagnostics
        run: |
          diagnostic_dir="$(mktemp -d "${RUNNER_TEMP}/ci-fixed.XXXXXX")"
          chmod 0700 "$diagnostic_dir"
          printf 'MMX_CI_FIXED_DIAGNOSTICS_DIR=%s\n' "$diagnostic_dir" >> "$GITHUB_ENV"

      - name: Run canonical test shard inside the realized environment
        run: python scripts/rwe_env.py gate --env /tmp/rwe-env --shard-index ${{ matrix.index }}

      - name: Upload fixed test diagnostics
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: rwe-fixed-diagnostics-${{ matrix.index }}
          path: |
            ${{ env.MMX_CI_FIXED_DIAGNOSTICS_DIR }}/ci-fixed-diagnostics.json
            ${{ env.MMX_CI_FIXED_DIAGNOSTICS_DIR }}/native-admission-unit/ci-fixed-diagnostics.json
            ${{ env.MMX_CI_FIXED_DIAGNOSTICS_DIR }}/native-admission-rollout/ci-fixed-diagnostics.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwe-receipt-linux-${{ matrix.index }}
          path: /tmp/rwe-env/rwe_receipt.json
          if-no-files-found: warn

  shadow-gate:
    needs: [prepare-lock, shadow-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require the complete shadow matrix
        env:
          LOCK_RESULT: ${{ needs.prepare-lock.result }}
          SHARDS_RESULT: ${{ needs.shadow-shards.result }}
        run: |
          set -euo pipefail
          if [ "$LOCK_RESULT" != success ] || [ "$SHARDS_RESULT" != success ]; then
            echo "All six canonical shards must complete successfully against the common lock"
            exit 1
          fi
