name: Mastermind OS

on:
  pull_request:
    paths:
      - app/mastermind_os/**
      - .github/workflows/mastermind-os.yml
  merge_group:
    types: [checks_requested]
  push:
    branches: [master]
    paths:
      - app/mastermind_os/**
      - .github/workflows/mastermind-os.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mastermind-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/mastermind_os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: app/mastermind_os/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
