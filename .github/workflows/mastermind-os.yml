name: Mastermind OS

on:
  pull_request:
    paths:
      - app/mastermind_os/**
      - .github/workflows/mastermind-os.yml
      - tests/test_native_macos_ci.py
  merge_group:
    types: [checks_requested]
  push:
    branches: [master]
    paths:
      - app/mastermind_os/**
      - .github/workflows/mastermind-os.yml
      - tests/test_native_macos_ci.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mastermind-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/mastermind_os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: app/mastermind_os/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build isolated browser source fixture
        run: npx vite build --config vite.browser-proof.config.ts
      - name: Record exact compiled source identity
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const receipt = JSON.stringify({schema: "mastermind.os.compiled_test_receipt.v1", source_revision: process.env.GITHUB_SHA, run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT, live_acceptance: false}) + "\n"; for (const dir of ["dist", "dist-browser-proof"]) fs.writeFileSync(`${dir}/build-receipt.json`, receipt);'
      - name: Retain compiled web candidate
        uses: actions/upload-artifact@v4
        with:
          name: mastermind-os-web-${{ github.sha }}
          path: app/mastermind_os/dist
          if-no-files-found: error
          retention-days: 7
      - name: Retain isolated browser source fixture
        uses: actions/upload-artifact@v4
        with:
          name: mastermind-os-browser-proof-${{ github.sha }}
          path: app/mastermind_os/dist-browser-proof
          if-no-files-found: error
          retention-days: 7

  # Compilation and unsigned packageability only; this is not beta acceptance.
  native-macos:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app/mastermind_os
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      # The default checkout is this exact integration/push commit, not PR head.
      MM_SOURCE_REVISION: ${{ github.sha }}
      MM_BUILD_IDENTITY: ci-native-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: app/mastermind_os/package-lock.json
      - name: Place build products in runner-owned temporary storage
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/mastermind-os-target" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - run: npm ci
      - name: Build packaged native assets
        run: npm run build -- --mode native
      - name: Check native Rust targets
        run: cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
      - name: Test native Rust targets
        run: cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml
      - name: Construct unsigned macOS app
        run: ./node_modules/.bin/tauri build --ci --no-sign --bundles app -- --locked
      - name: Verify package and locked inputs
        run: |
          bundle="$CARGO_TARGET_DIR/release/bundle/macos/Mastermind OS.app"
          test -s "$bundle/Contents/Info.plist"
          test -x "$bundle/Contents/MacOS/mastermind-os"
          git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
          {
            echo "Unsigned native CI package constructed; no release or installation acceptance."
            echo "Source revision: $MM_SOURCE_REVISION"
            echo "Build identity: $MM_BUILD_IDENTITY"
            shasum -a 256 "$bundle/Contents/MacOS/mastermind-os"
          } >> "$GITHUB_STEP_SUMMARY"
