name: Hermes candidate qualification

on:
  pull_request:
    paths:
      - 'integrations/hermes_qualification/**'
      - '.github/workflows/hermes-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inert-config-preflight:
    name: Hermes offline policy and negative tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only the audited YAML parser
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Compile offline canary
        run: python -m compileall -q integrations/hermes_qualification
      - name: Run real no-network negative and receipt tests
        run: python -m unittest discover -v -s integrations/hermes_qualification/tests -p 'test_*.py'
