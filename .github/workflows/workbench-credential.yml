name: Workbench credential engine

on:
  pull_request:
    paths:
      - 'integrations/workbench_browser_mcp/**'
      - 'integrations/workbench_action_mcp/**'
      - 'integrations/worker_browser_runtime/**'
      - 'control_plane/worker_browser_b1.py'
      - 'scripts/install_worker_browser_b1_runtime.sh'
      - 'tests/test_workbench_browser_credential.py'
      - 'tests/test_workbench_vault_real_engine.py'
      - 'tests/test_workbench_vault_launch.py'
      - 'tests/fixtures/hermes_vault/**'
      - '.github/workflows/workbench-credential.yml'

permissions:
  contents: read

jobs:
  credential-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.6.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project test and pinned protocol dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]' -r requirements/executive-mcp-macos-arm64-py312.in 'pytest==9.1.1'
      - name: Install exact npm engines and disposable Chromium
        working-directory: integrations/worker_browser_runtime
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/integrations/worker_browser_runtime/browsers
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify source policy and redaction semantics
        run: |
          node --test integrations/worker_browser_runtime/vault/child.test.cjs
          python -m pytest -o addopts= -q tests/test_workbench_browser_credential.py tests/test_workbench_vault_launch.py
      - name: Qualify actual Hermes writer, Fernet, Playwright and persisted redaction
        env:
          MASTERMIND_PINNED_VAULT_ENGINE_TEST: '1'
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/integrations/worker_browser_runtime/browsers
        run: python -m pytest -o addopts= -q --tb=short tests/test_workbench_vault_real_engine.py
