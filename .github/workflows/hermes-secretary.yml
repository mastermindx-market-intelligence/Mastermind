name: Hermes secretary shadow

on:
  pull_request:
    paths:
      - 'integrations/hermes_secretary/**'
      - '.github/workflows/hermes-secretary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-offline:
    name: Secretary shadow unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile the shadow package
        run: python -m compileall -q integrations/hermes_secretary
      - name: Run offline shadow tests
        run: python -m unittest discover -v -s integrations/hermes_secretary/tests -p 'test_*.py'
