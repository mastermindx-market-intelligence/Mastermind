name: Session B Restart Survivability Builder V2

on:
  push:
    branches:
      - sol/executive-worker-restart-survivability-380-20260918
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: session-b-restart-survivability-builder-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout exact source carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sol/executive-worker-restart-survivability-380-20260918

      - name: Checkout pinned Macro engine
        uses: actions/checkout@v4
        with:
          repository: mastermindx-market-intelligence/macro
          ref: 256c757b3c4f0ec759571c29a30a71387d0a18f8
          path: vendor/macro_src
          sparse-checkout: |
            engine
            lib
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Repair deterministic test selector
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/session_b_tests_patch.py')
          text = path.read_text(encoding='utf-8')
          old = '''    "import sys\\nimport time\\n",
              "import sys\\nimport threading\\nimport time\\n",
          )'''
          new = '''    "import stat\\nimport subprocess\\nimport sys\\nimport time\\n",
              "import stat\\nimport subprocess\\nimport sys\\nimport threading\\nimport time\\n",
          )'''
          if text.count(old) != 1:
              raise SystemExit(f'test selector repair count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply discriminating tests only
        run: python .github/session_b_tests_patch.py

      - name: Prove protected source is RED
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_worker_execution_contract.py \
            -k worker_recovery_binding_round_trips_exact_launch_spec \
            2>&1 | tee session-b-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "Expected protected source to fail the recovery discriminator"
            exit 1
          fi

      - name: Apply minimum recovery architecture
        run: |
          python .github/session_b_contract_patch.py
          python .github/session_b_codex_patch.py
          python .github/session_b_supervisor_patch.py

      - name: Compile changed source
        run: |
          python -m py_compile \
            control_plane/worker_execution_contract.py \
            control_plane/worker_adapter.py \
            control_plane/codex_worker.py \
            control_plane/executive_supervisor.py \
            control_plane/executive_worker_broker.py \
            control_plane/executive_service.py

      - name: Run focused recovery and cancellation matrix
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_worker_execution_contract.py \
            tests/test_worker_adapter.py \
            tests/test_executive_codex_worker.py \
            tests/test_executive_supervisor.py \
            tests/test_executive_worker_broker.py \
            tests/test_executive_service.py \
            -k 'recovery or reattach or recovered or restart or cancel_sigkills_descendant_that_ignores_sigterm or stdout_cap_is_a_terminal_validation_failure or worker_normal_exit_foreign_pipe_holder' \
            2>&1 | tee session-b-focused.log

      - name: Run complete owning regression pack
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_worker_execution_contract.py \
            tests/test_worker_adapter.py \
            tests/test_executive_codex_worker.py \
            tests/test_executive_supervisor.py \
            tests/test_executive_worker_broker.py \
            tests/test_executive_service.py \
            2>&1 | tee session-b-regression.log

      - name: Inspect source delta
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Upload immutable builder evidence
        uses: actions/upload-artifact@v4
        with:
          name: session-b-restart-survivability-evidence-v2
          path: |
            session-b-red.log
            session-b-focused.log
            session-b-regression.log
          if-no-files-found: error

      - name: Remove temporary builder machinery
        run: |
          rm -f \
            .github/session_b_tests_patch.py \
            .github/session_b_contract_patch.py \
            .github/session_b_codex_patch.py \
            .github/session_b_supervisor_patch.py \
            .github/workflows/session-b-builder.yml \
            .github/workflows/session-b-builder-v2.yml
          rm -f session-b-red.log session-b-focused.log session-b-regression.log

      - name: Commit and push exact verified head
        run: |
          git config user.name "Mastermind Session B Builder"
          git config user.email "session-b-builder@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(executive): preserve workers across supervisor restart"
          git push origin HEAD:sol/executive-worker-restart-survivability-380-20260918
