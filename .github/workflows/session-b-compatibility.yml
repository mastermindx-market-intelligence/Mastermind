name: Session B Current-Master and PR 811 Compatibility

on:
  push:
    branches:
      - tmp/session-b-compat-9f7820c7-811

permissions:
  contents: write

jobs:
  compatibility:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout disposable compatibility carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: tmp/session-b-compat-9f7820c7-811

      - name: Checkout pinned Macro engine
        uses: actions/checkout@v4
        with:
          repository: mastermindx-market-intelligence/macro
          ref: 256c757b3c4f0ec759571c29a30a71387d0a18f8
          path: vendor/macro_src
          sparse-checkout: |
            engine
            lib
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Merge exact Session B and PR 811 heads
        shell: bash
        run: |
          set -o pipefail
          git config user.name "Mastermind Compatibility Proof"
          git config user.email "compatibility-proof@users.noreply.github.com"
          git fetch --no-tags origin \
            9f7820c73b399698f6b3bb9b445cbfddfc2d16a1 \
            6624cadaa7008ff150705c9f0d615ae4c5d7ba42
          git merge --no-ff --no-edit \
            9f7820c73b399698f6b3bb9b445cbfddfc2d16a1 \
            2>&1 | tee session-b-merge.log
          git merge --no-ff --no-edit \
            6624cadaa7008ff150705c9f0d615ae4c5d7ba42 \
            2>&1 | tee pr811-merge.log
          git status --short | tee integrated-status.log
          git log -3 --oneline | tee integrated-heads.log

      - name: Compile combined source
        run: |
          python -m py_compile \
            control_plane/worker_execution_contract.py \
            control_plane/worker_adapter.py \
            control_plane/codex_worker.py \
            control_plane/executive_supervisor.py \
            control_plane/executive_worker_broker.py \
            control_plane/executive_service.py \
            control_plane/executive_operator_supervisor.py

      - name: Run combined owning and commission-context suites
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_worker_execution_contract.py \
            tests/test_worker_adapter.py \
            tests/test_executive_codex_worker.py \
            tests/test_executive_supervisor.py \
            tests/test_executive_worker_broker.py \
            tests/test_executive_service.py \
            tests/test_executive_operator_supervisor.py \
            tests/test_slack_agent_dialogue_executive_terminal_return_projector.py \
            tests/test_executive_ceo_ingress.py \
            tests/test_ceo_submit_armed_composition.py \
            2>&1 | tee session-b-pr811-compatibility.log

      - name: Verify combined tree hygiene
        run: |
          git diff --check HEAD~2..HEAD
          git status --short

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-b-pr811-compatibility-evidence
          path: |
            session-b-merge.log
            pr811-merge.log
            integrated-status.log
            integrated-heads.log
            session-b-pr811-compatibility.log
          if-no-files-found: warn

      - name: Delete disposable compatibility branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          request = urllib.request.Request(
              (
                  "https://api.github.com/repos/"
                  + repo
                  + "/git/refs/heads/tmp/session-b-compat-9f7820c7-811"
              ),
              method="DELETE",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "mastermind-session-b-compatibility",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in {204}:
                  raise RuntimeError(
                      f"unexpected branch-delete status {response.status}"
                  )
          PY
