name: Session B PR 811 Conflict Capture

on:
  push:
    branches:
      - tmp/session-b-compat-9f7820c7-811

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout disposable compatibility carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: tmp/session-b-compat-9f7820c7-811

      - name: Reproduce exact conflicts
        shell: bash
        run: |
          set -o pipefail
          git config user.name "Mastermind Compatibility Proof"
          git config user.email "compatibility-proof@users.noreply.github.com"
          git fetch --no-tags origin \
            9f7820c73b399698f6b3bb9b445cbfddfc2d16a1 \
            6624cadaa7008ff150705c9f0d615ae4c5d7ba42
          git merge --no-ff --no-edit \
            9f7820c73b399698f6b3bb9b445cbfddfc2d16a1 \
            2>&1 | tee session-b-merge.log
          set +e
          git merge --no-ff --no-edit \
            6624cadaa7008ff150705c9f0d615ae4c5d7ba42 \
            2>&1 | tee pr811-merge.log
          merge_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$merge_status" > merge-status.txt
          git status --short | tee integrated-status.log
          git diff --cc > conflict.diff
          mkdir -p conflicts/control_plane conflicts/tests
          cp control_plane/executive_supervisor.py \
            conflicts/control_plane/executive_supervisor.py
          cp tests/test_executive_supervisor.py \
            conflicts/tests/test_executive_supervisor.py

      - name: Upload exact conflict evidence
        uses: actions/upload-artifact@v4
        with:
          name: session-b-pr811-conflict-evidence
          path: |
            session-b-merge.log
            pr811-merge.log
            merge-status.txt
            integrated-status.log
            conflict.diff
            conflicts/control_plane/executive_supervisor.py
            conflicts/tests/test_executive_supervisor.py
          if-no-files-found: error
