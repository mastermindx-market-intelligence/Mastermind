          persist-credentials: false

      - name: Verify event source and immutable fixture anchor
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e 'edd30b4686d3aaf358b4ca6ebd9485b04d15751d^{commit}'

      # `vendor/macro` is a tracked developer symlink to `vendor/macro_src`.
      # A clean hosted runner lacks the local sibling checkout; pin exactly
      # the importable Macro engine revision, not VPS-owned runtime data.
      # DEC:B1-MACRO-PRIVATE-CUTOVER -- github.token is scoped to THIS repo
      # and can currently read Macro only because Macro is public. When the
      # upstream repository becomes private, the owner must first install a
      # read-only MACRO_CI_READ_TOKEN (fine-grained PAT or GitHub App token
      # with Contents: Read on mastermindx-market-intelligence/macro).
      # The `secrets.MACRO_CI_READ_TOKEN || github.token` fallback keeps CI
      # working before that admission; no privilege expansion or anonymous
      # fallback is allowed after private cutover.
      - name: Checkout pinned Macro engine
        uses: actions/checkout@v4
        with:
          repository: mastermindx-market-intelligence/macro
          ref: 256c757b3c4f0ec759571c29a30a71387d0a18f8
          path: vendor/macro_src
          sparse-checkout: |
            engine
            lib
          persist-credentials: false
          token: ${{ secrets.MACRO_CI_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: app/mastermind_os/package-lock.json

      - name: Install Node dependencies
        run: npm ci --prefix app/mastermind_os

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Fast deterministic release-source checks before expensive hosted work.
      # Reuse the incumbent strict EVAL changed-path and fixed-role package
      # tests without replacing or excluding any discovery-first shard.
      # These run for every shard, with the same immutable checkout; failures
      # stop the shard early and still fail the original protected test fan-in.
      - name: Fast source-bound release preflight
        run: >-
          python -m pytest -q --tb=short
          tests/test_agent_eval_inertness.py::test_changed_paths_are_within_the_allowed_r0_surface
          tests/test_agent_eval_inertness.py::test_no_control_plane_config_dependency_or_workflow_file_touched
          tests/test_operator_first_policy.py::test_incumbent_semantic_discriminator_operator_owns_closure

      - name: Verify private Fabric HTTP compatibility and incumbent backend lifetime
        working-directory: integrations/studio_direct_mcp
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test gateway-modern-fabric.test.mjs gateway-fleet-git-failure.test.mjs gateway.test.mjs gateway-shared-backend.test.mjs gateway-owner-lifecycle-regression.test.mjs gateway-output-budget.test.mjs fabric-backend.test.mjs private-cli.test.mjs private-tunnel-auth.test.mjs
          python -m unittest discover -s . -p 'private_service*test.py'
          python -m unittest discover -s . -p 'control_bundle*test.py'


  source_qualification_native:
    name: Source qualification native
    needs: [pr_scope]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'full')) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Acquire immutable corpus fixture anchor
        uses: actions/checkout@v4
        with:
          ref: edd30b4686d3aaf358b4ca6ebd9485b04d15751d
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout event source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify event source and immutable fixture anchor
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e 'edd30b4686d3aaf358b4ca6ebd9485b04d15751d^{commit}'

      # `vendor/macro` is a tracked developer symlink to `vendor/macro_src`.
      # A clean hosted runner lacks the local sibling checkout; pin exactly
      # the importable Macro engine revision, not VPS-owned runtime data.
      # DEC:B1-MACRO-PRIVATE-CUTOVER -- github.token is scoped to THIS repo
      # and can currently read Macro only because Macro is public. When the
      # upstream repository becomes private, the owner must first install a
      # read-only MACRO_CI_READ_TOKEN (fine-grained PAT or GitHub App token
      # with Contents: Read on mastermindx-market-intelligence/macro).
      # The `secrets.MACRO_CI_READ_TOKEN || github.token` fallback keeps CI
      # working before that admission; no privilege expansion or anonymous
      # fallback is allowed after private cutover.
      - name: Checkout pinned Macro engine
        uses: actions/checkout@v4
        with:
          repository: mastermindx-market-intelligence/macro
          ref: 256c757b3c4f0ec759571c29a30a71387d0a18f8
          path: vendor/macro_src
          sparse-checkout: |
            engine
            lib
          persist-credentials: false
          token: ${{ secrets.MACRO_CI_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: app/mastermind_os/package-lock.json

      - name: Install Node dependencies
        run: npm ci --prefix app/mastermind_os

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

