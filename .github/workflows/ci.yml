name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # `vendor/macro` is a tracked developer symlink to `vendor/macro_src`.
      # A clean hosted runner has no sibling checkout behind that symlink, so
      # app imports would otherwise depend on untracked workstation state.
      # Pin the exact Macro engine revision used by this release and fetch only
      # its importable code surface; runtime data remains VPS-owned and is never
      # copied into CI or this repository.
      - name: Checkout pinned Macro engine
        uses: actions/checkout@v4
        with:
          repository: mastermindx-market-intelligence/macro
          ref: 256c757b3c4f0ec759571c29a30a71387d0a18f8
          path: vendor/macro_src
          sparse-checkout: |
            engine
            lib
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile source
        run: >-
          python -m compileall -q
          app bot brain bridge control_plane data_layer loop portfolio scripts

      - name: Validate shell scripts
        run: |
          find scripts -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n

      - name: Run hermetic governance gate
        run: >-
          python -m pytest -q
          tests/test_auth.py
          tests/test_gate.py
          tests/test_book_state_isolation.py
          tests/test_vendored_read_ratchet.py

      - name: Run Portfolio v2 safety gate
        run: >-
          python -m pytest -q
          tests/test_portfolio_archival.py
          tests/test_decision_submission_v2.py
          tests/test_pending_target_cutover.py
          tests/test_paper_transaction_boundary.py
          tests/test_execution_quote_gap.py
          tests/test_pending_decision_provenance.py
          tests/test_portfolio_intelligence.py
          tests/test_portfolio_intelligence_mcp.py
          tests/test_portfolio_learning.py
          tests/test_lesson_application_trace.py
          tests/test_forward_evaluation.py
          tests/test_advisor_proposal_lifecycle.py
          tests/test_scheduler_governance.py
          tests/test_deploy_provenance.py
          tests/test_cli_bridge.py
          tests/test_codex_bridge.py
