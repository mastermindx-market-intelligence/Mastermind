name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `vendor/macro` is a tracked developer symlink to `vendor/macro_src`.
      # A clean hosted runner has no sibling checkout behind that symlink, so
      # app imports would otherwise depend on untracked workstation state.
      # Pin the exact Macro engine revision used by this release and fetch only
      # its importable code surface; runtime data remains VPS-owned and is never
      # copied into CI or this repository.
      # DEC:B1-MACRO-PRIVATE-CUTOVER -- macro is going private. The default
      # `github.token` this job otherwise relies on is scoped to THIS
      # repository only and cannot read another repo, so this checkout works
      # today solely because mastermindx-market-intelligence/macro is still
      # public. The `secrets.MACRO_CI_READ_TOKEN || github.token` fallback
      # keeps CI green right now (an undefined secret evaluates to an empty,
      # falsy string, so behavior stays byte-identical to today) and keeps it
      # green after the flip once the operator adds a read-only
      # MACRO_CI_READ_TOKEN secret (fine-grained PAT or GitHub App
      # installation token with Contents: Read on
      # mastermindx-market-intelligence/macro, or an `ssh-key:` deploy-key
      # equivalent) before or at the visibility flip.
      - name: Checkout pinned Macro engine
        uses: actions/checkout@v4
        with:
          repository: mastermindx-market-intelligence/macro
          ref: 256c757b3c4f0ec759571c29a30a71387d0a18f8
          path: vendor/macro_src
          sparse-checkout: |
            engine
            lib
          persist-credentials: false
          token: ${{ secrets.MACRO_CI_READ_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile source
        run: >-
          python -m compileall -q
          app bot brain bridge common control_plane data_layer integrations loop
          portfolio scripts

      - name: Validate shell scripts
        run: |
          find scripts ops/executive_os -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n

      # `--jobs` is placement, not scope: scripts/ci_pytest.py resolves the
      # same discovery-first module set first and refuses to start unless the
      # shards are a total, disjoint cover of it. The gate had become a single
      # serial pytest process taking ~98% of a 26-31 minute job on a 4-vCPU
      # hosted runner whose other three cores sat idle.
      #
      # Three, not four, on a 4-vCPU runner. Parts of this suite shell out --
      # `node --test` mutation runs, git subprocesses -- and some of those
      # assert against a real wall clock. Saturating every core starves those
      # child processes and turns their timing assertions into noise; the
      # spare core is deliberate headroom, not unused capacity.
      #
      # Sharding deliberately stays INSIDE this one job. Branch protection on
      # master requires the single check context `test` with enforce_admins
      # true; a workflow matrix would rename the checks to `test (0)`, `test
      # (1)` and so on, leave `test` permanently unreported, and block every
      # merge.
      - name: Run repository test gate
        run: python scripts/ci_pytest.py --jobs 3
