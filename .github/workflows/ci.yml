name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Source scope for PR and merge-group is derived from protected code.
  # A changing/unverifiable queue, CI, security or source-law diff runs full CI.
  pr_scope:
    name: PR test scope
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      tier: ${{ steps.scope.outputs.tier }}
      needs_node: ${{ steps.scope.outputs.needs_node }}
      source_base: ${{ steps.scope.outputs.source_base }}
      source_head: ${{ steps.scope.outputs.source_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify integrated source diff using protected base code
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          trusted="$RUNNER_TEMP/ci-trusted-base"
          mkdir -p "$trusted"
          trusted_base="$PR_BASE_SHA"
          if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            trusted_base="$(git rev-parse --verify refs/remotes/origin/master 2>/dev/null || true)"
          fi
          if [ -n "$trusted_base" ] &&
             git cat-file -e "${trusted_base}:scripts/ci_pr_scope.py" 2>/dev/null &&
             git cat-file -e "${trusted_base}:control_plane/github_review_risk_policy.py" 2>/dev/null; then
            git archive "$trusted_base" scripts/ci_pr_scope.py control_plane/github_review_risk_policy.py |
              tar -x -C "$trusted"
            if grep -q '^def classify_merge_group(' "$trusted/scripts/ci_pr_scope.py"; then
              PYTHONPATH="$trusted" python "$trusted/scripts/ci_pr_scope.py" \
                --repo "$GITHUB_WORKSPACE" --event "$GITHUB_EVENT_PATH" \
                --event-type "$GITHUB_EVENT_NAME" --protected-base "$trusted_base" \
                --repository "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT"
            else
              # First protected installation: legacy scope has no merge-group
              # support and this PR modifies CI itself, so it must run FULL.
              PYTHONPATH="$trusted" python "$trusted/scripts/ci_pr_scope.py" \
                --repo "$GITHUB_WORKSPACE" --event "$GITHUB_EVENT_PATH" \
                --repository "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT"
            fi
          else
            printf 'mode=full\ntier=HOLD\nneeds_node=false\n' >> "$GITHUB_OUTPUT"
            echo 'CI_SCOPE source not in protected base: required full suite'
          fi

  # Fast and standard integrated queue candidates reuse the same trusted,
  # bounded PR checks; critical or unqualified groups run every full shard.
  # The stable protected status context is still the final job named 'test'.
  # Heavy work must stop when this same-PR run is superseded/cancelled.
  # Keep the small final test gate on always() so cancellation cannot look green.
  pr_fast:
    name: PR fast checks
    needs: [pr_scope]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode != 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact changed source without executing untrusted PR text
        env:
          PR_BASE_SHA: ${{ needs.pr_scope.outputs.source_base }}
          PR_HEAD_SHA: ${{ needs.pr_scope.outputs.source_head }}
        run: |
          set -euo pipefail
          git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          python -m compileall -q scripts/ci_pr_scope.py control_plane/github_review_risk_policy.py
      - uses: actions/setup-python@v5
        if: ${{ needs.pr_scope.outputs.mode == 'smoke' }}
        with:
          python-version: "3.12"
          cache: pip
      # Source-proximate web tests import app.deps through the real application.
      # Supply the same immutable engine/lib source as the full-shard job;
      # no runtime data, new credential policy or alternate dependency owner.
      - name: Checkout pinned Macro engine for source-proximate tests
        if: ${{ needs.pr_scope.outputs.mode == 'smoke' }}
        uses: actions/checkout@v4
        with:
          repository: mastermindx-market-intelligence/macro
          ref: 256c757b3c4f0ec759571c29a30a71387d0a18f8
          path: vendor/macro_src
          sparse-checkout: |
            engine
            lib
          persist-credentials: false
          token: ${{ secrets.MACRO_CI_READ_TOKEN || github.token }}
      - name: Install focused Python test dependencies
        if: ${{ needs.pr_scope.outputs.mode == 'smoke' }}
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Bounded source-proximate PR tests
        if: ${{ needs.pr_scope.outputs.mode == 'smoke' }}
        env:
          PR_BASE_SHA: ${{ needs.pr_scope.outputs.source_base }}
          PR_HEAD_SHA: ${{ needs.pr_scope.outputs.source_head }}
        run: >-
          python -m scripts.ci_pr_smoke
          --repo . --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
      - uses: actions/setup-node@v4
        if: ${{ needs.pr_scope.outputs.needs_node == 'true' }}
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: app/mastermind_os/package-lock.json
      - name: Typecheck affected web application
        if: ${{ needs.pr_scope.outputs.needs_node == 'true' }}
        run: |
          npm ci --prefix app/mastermind_os --ignore-scripts --no-audit --no-fund
          npm --prefix app/mastermind_os run typecheck

  # Required source qualifications overlap the canonical pytest matrix.
  # Their unchanged commands and pinned fixtures remain mandatory at test.
  source_qualification:
    name: Source qualification
    needs: [pr_scope]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'full')) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Acquire immutable corpus fixture anchor
        uses: actions/checkout@v4
        with:
          ref: edd30b4686d3aaf358b4ca6ebd9485b04d15751d
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout event source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify event source and immutable fixture anchor
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e 'edd30b4686d3aaf358b4ca6ebd9485b04d15751d^{commit}'

      # `vendor/macro` is a tracked developer symlink to `vendor/macro_src`.
      # A clean hosted runner lacks the local sibling checkout; pin exactly
      # the importable Macro engine revision, not VPS-owned runtime data.
      # DEC:B1-MACRO-PRIVATE-CUTOVER -- github.token is scoped to THIS repo
      # and can currently read Macro only because Macro is public. When the
      # upstream repository becomes private, the owner must first install a
      # read-only MACRO_CI_READ_TOKEN (fine-grained PAT or GitHub App token
      # with Contents: Read on mastermindx-market-intelligence/macro).
      # The `secrets.MACRO_CI_READ_TOKEN || github.token` fallback keeps CI
      # working before that admission; no privilege expansion or anonymous
      # fallback is allowed after private cutover.
      - name: Checkout pinned Macro engine
        uses: actions/checkout@v4
        with:
          repository: mastermindx-market-intelligence/macro
          ref: 256c757b3c4f0ec759571c29a30a71387d0a18f8
          path: vendor/macro_src
          sparse-checkout: |
            engine
            lib
          persist-credentials: false
          token: ${{ secrets.MACRO_CI_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: app/mastermind_os/package-lock.json

      - name: Install Node dependencies
        run: npm ci --prefix app/mastermind_os

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Fast deterministic release-source checks before expensive hosted work.
      # Reuse the incumbent strict EVAL changed-path and fixed-role package
      # tests without replacing or excluding any discovery-first shard.
      # These run for every shard, with the same immutable checkout; failures
      # stop the shard early and still fail the original protected test fan-in.
      - name: Fast source-bound release preflight
        run: >-
          python -m pytest -q --tb=short
          tests/test_agent_eval_inertness.py::test_changed_paths_are_within_the_allowed_r0_surface
          tests/test_agent_eval_inertness.py::test_no_control_plane_config_dependency_or_workflow_file_touched
          tests/test_operator_first_policy.py::test_incumbent_semantic_discriminator_operator_owns_closure

      - name: Verify Paper direct pinned MCP SDK
        run: |
          PAPER_MCP_VENV="$RUNNER_TEMP/paper-direct-mcp-ci"
          python -m venv "$PAPER_MCP_VENV"
          "$PAPER_MCP_VENV/bin/python" -m pip install --disable-pip-version-check \
            -r integrations/paper_desktop/requirements-mcp.txt
          PAPER_DIRECT_PINNED_SDK_TESTS=1 "$PAPER_MCP_VENV/bin/python" -I -m unittest discover -s tests -p 'test_paper_direct*.py'
          PAPER_DIRECT_PINNED_SDK_TESTS=1 "$PAPER_MCP_VENV/bin/python" -I -m unittest discover -s tests -p 'test_paper_mcp_results.py'

      # Exercise the guarded Paper Studio prepare action in hosted CI.
      # These Node tests are not included in the canonical pytest shard plan.
      - name: Verify Paper Studio prepare guard
        working-directory: integrations/studio_direct_mcp
        run: node --test paper-design.test.mjs

      - name: Compile source
        run: >-
          python -m compileall -q
          app bot brain bridge common control_plane data_layer integrations loop
          portfolio scripts

      - name: Validate shell scripts
        run: |
          find scripts ops/executive_os -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n

      - name: Verify native application admission unittest contracts
        run: |
          python - <<'PYTEST'
          import unittest
          suite = unittest.TestSuite()
          for pattern in (
              "test_application_turn_*.py", "test_go_application_*.py", "test_application_http_transports.py", "test_quota_continuity.py",
              "test_application_http_admission.py", "test_application_http_realm_projection.py",
              "test_bailian_application_handler_composition.py",
              "test_broker_prelease_deadline.py", "test_slot_release_custody.py",
              "test_qwen_account_eligibility.py", "test_qwen_429_account_priority.py",
          ):
              suite.addTests(unittest.defaultTestLoader.discover(
                  "ops/native_fabric/quota_continuity/tests", pattern=pattern))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PYTEST

      # A root-only finite owner must have positive proof, not skipped tests.
      # The container receives only tracked public source and disposable tmpfs.
      - name: Verify closed application transport in isolated root fixtures
        run: |
          set -euo pipefail
          application_transport_source="$(mktemp -d "${RUNNER_TEMP}/application-transport-source.XXXXXX")"
          trap 'rm -rf "$application_transport_source"' EXIT
          git archive --format=tar HEAD | tar -x -C "$application_transport_source"
          # The isolated root has no DAC override; expose only this public archive.
          chmod 0755 "$application_transport_source"
          docker build --file tests/application_tunnel_ci/Dockerfile \
            --tag mastermind-application-transport:${{ github.sha }} tests/application_tunnel_ci
          docker run --rm --network=none --cap-drop=ALL \
            --security-opt=no-new-privileges --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,mode=1777 \
            --tmpfs /fixture:rw,exec,nosuid,nodev,mode=0755 \
            --mount "type=bind,src=${application_transport_source},dst=/repo,readonly" \
            mastermind-application-transport:${{ github.sha }}

      # Use a separate pinned owner fixture; keep the ordinary Macro vendor pin.
      # This remains mandatory at the final gate, including merge_group and reuse.
      - name: Checkout paired Brain production owner fixture
        uses: actions/checkout@v4
        with:
          repository: mastermindx-market-intelligence/macro
          ref: f0375acf4ba076718e7cb420ed28ab61fb0a4f26
          path: .ci-production-macro
          sparse-checkout: |
            engine
            lib
            config
          persist-credentials: false
          token: ${{ secrets.MACRO_CI_READ_TOKEN || github.token }}
      - name: Verify actual Brain Fabric and production inference composition
        env:
          MM_REQUIRE_PRODUCTION_MODE_COMPOSITION: "1"
          MM_REQUIRE_FABRIC_COMPOSITION: "1"
          MM_REQUIRE_FABRIC_BROWSER: "1"
        run: |
          set -euo pipefail
          brain_composition_root="$(mktemp -d "${RUNNER_TEMP}/brain-production-composition.XXXXXX")"
          trap 'rm -rf "$brain_composition_root" "$GITHUB_WORKSPACE/.ci-production-macro"' EXIT
          git archive HEAD brain bot common app control_plane portfolio \
            scripts/translate_all.py \
            tests/integration/test_production_inference_composition.py \
            tests/integration/test_fabric_inference_composition.py \
            tests/integration/test_fabric_translation_composition.py \
            tests/integration/test_fabric_chat_inference_composition.py \
            tests/integration/test_fabric_chat_buffered_delivery.py \
            tests/integration/test_fabric_text_native_application.py \
            tests/integration/test_fabric_chat_browser.py \
            ops/native_fabric/quota_continuity \
            ops/native_fabric/experiential_proxy/gateway.py |
            tar -x -C "$brain_composition_root"
          mkdir -p "$brain_composition_root/vendor/macro"
          # Isolate synthetic owner configuration in a copy of the exact source.
          cp -R "$GITHUB_WORKSPACE/.ci-production-macro/engine" \
            "$GITHUB_WORKSPACE/.ci-production-macro/lib" \
            "$GITHUB_WORKSPACE/.ci-production-macro/config" "$brain_composition_root/vendor/macro/"
          touch "$brain_composition_root/vendor/macro/.fabric-composition-fixture"
          export MM_FABRIC_FIXTURE_ROOT="$brain_composition_root/vendor/macro"
          cd "$brain_composition_root"
          PYTHONPATH="$brain_composition_root" python -m unittest discover -s tests/integration \
            -p 'test_*inference_composition.py' -v
          PYTHONPATH="$brain_composition_root" python -m unittest discover -s tests/integration \
            -p test_fabric_chat_buffered_delivery.py -v
          PYTHONPATH="$brain_composition_root" python -m unittest discover -s tests/integration \
            -p test_fabric_text_native_application.py -v
          PYTHONPATH="$brain_composition_root" python -m unittest discover -s tests/integration \
            -p test_fabric_translation_composition.py -v
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install --with-deps chromium
          PYTHONPATH="$brain_composition_root" python -m unittest discover -s tests/integration \
            -p test_fabric_chat_browser.py -v


