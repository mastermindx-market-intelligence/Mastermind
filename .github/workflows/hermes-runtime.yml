name: Hermes runtime

on:
  pull_request:
    paths:
      - 'integrations/hermes_runtime/**'
      - '.github/workflows/hermes-runtime.yml'
      - 'requirements/executive-mcp-macos-arm64-py312.in'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-acceptance:
    name: Hermes runtime acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the reviewed edge package pins and test runner
        # Reuse package inputs for the real SDK/HTTP fixtures. This Linux test
        # matrix does not attest the production macOS runtime or its hash lock.
        run: python -m pip install --disable-pip-version-check -r requirements/executive-mcp-macos-arm64-py312.in 'pytest==9.1.1'
      - name: Compile the runtime package
        run: python -m compileall -q integrations/hermes_runtime
      - name: Run runtime acceptance tests
        run: python -m pytest -q integrations/hermes_runtime/tests
