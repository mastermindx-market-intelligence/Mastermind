name: Hermes runtime

on:
  pull_request:
    paths:
      - 'integrations/hermes_runtime/**'
      - '.github/workflows/hermes-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-acceptance:
    name: Hermes runtime acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only the audited YAML parser
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Compile the runtime package
        run: python -m compileall -q integrations/hermes_runtime
      - name: Run runtime acceptance tests
        run: python -m unittest discover -v -s integrations/hermes_runtime/tests -p 'test_*.py'
