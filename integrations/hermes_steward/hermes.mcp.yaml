# Hermes MCP consumer for the existing Mastermind Steward read surface.
# Pin: NousResearch/hermes-agent@1c0cd667746d3395fe9e1b6c74f8f85952486f18
# Schema used: mcp_servers.<name>.{url,headers,timeout,enabled,tools.{include,resources,prompts}}
# Tokens stay in the process environment. This file grants no write tool.
# PASS_OFFLINE_STEWARD_READ_CONFIG is not a live Steward or Hermes admission.
model:
  provider: zai
  default: glm-5.3
auxiliary:
  vision:
    provider: zai
    model: glm-5.3-flash
agent:
  disabled_toolsets:
    - web
    - browser
    - terminal
    - file
    - code_execution
    - vision
    - video
    - image_gen
    - video_gen
    - x_search
    - tts
    - stt
    - skills
    - todo
    - kanban
    - memory
    - context_engine
    - session_search
    - connections
    - delegation
    - cronjob
    - yuanbao
    - computer_use
    - a2a
toolsets:
  - clarify
mcp_servers:
  mastermind_steward:
    url: "${MASTERMIND_STEWARD_MCP_URL}"
    headers:
      Authorization: "Bearer ${MASTERMIND_STEWARD_ACCESS_TOKEN}"
    enabled: true
    timeout: 30
    tools:
      include:
        - list_responsibilities
        - get_responsibility
        - get_attention
        - get_current_runtime
        - explain_blocker
        - resolve_surface
      resources: false
      prompts: false
