# Secretary runtime profile. Path to a mode-0600 secrets file only — never a secret.
# Upstream pin is enforced. clarify is the only admitted Hermes toolset.
schema: mastermind.hermes_runtime_profile.v1
upstream:
  repository: https://github.com/NousResearch/hermes-agent.git
  sha: 1c0cd667746d3395fe9e1b6c74f8f85952486f18
role: mmsecretary
tool_allowlist:
  - clarify
model:
  provider: zai
  default: glm-5.3-flash
secrets_file: ~/.config/hermes-runtime/mmsecretary.secrets.env
gateway:
  host: 127.0.0.1
  port: 8765
  backend_port: 8766
  auth: required
service:
  restart: on-failure
  restart_sec: 2
  start_limit_burst: 5
  start_limit_interval_sec: 60
memory:
  sample_interval_sec: 5
state_dir: ~/.local/state/hermes-runtime-mmsecretary
