# mastermind.hermes_model_provider_overlay.v1
# Hermes provider overlay for profile mmmeta.
# Upstream pin NousResearch/hermes-agent@1c0cd667746d3395fe9e1b6c74f8f85952486f18.
# logical_model: glm-5.3
# served_model: glm-5.3
# production_armed: false
# executive_admission: false
# No api_key values. key_env names point at 0600 files or env vars.
# Automatic Hermes provider failover is omitted so 429 and outage turns are not replayed.
# Qualification config.yaml is a separate disarmed preflight document.
model:
  provider: zai-glm
  default: "glm-5.3"
  base_url: "https://api.z.ai/api/paas/v4"
  key_env: ZAI_API_KEY
  api_mode: chat_completions
auxiliary:
  vision:
    provider: minimax-m3
    model: "MiniMax-M3"
    base_url: "https://api.minimax.io/v1"
    key_env: MINIMAX_TOKEN_PLAN_KEY
    api_mode: chat_completions
providers:
  zai-glm:
    name: "Z.AI GLM-5.3"
    api: "https://api.z.ai/api/paas/v4"
    key_env: ZAI_API_KEY
    api_mode: chat_completions
    default_model: "glm-5.3"
  byteplus-modelark:
    name: "BytePlus ModelArk Commercial"
    api: "https://ark.ap-southeast.bytepluses.com/api/v3"
    key_env: BYTEPLUS_MODELARK_API_KEY
    api_mode: chat_completions
    default_model: "glm-5-3-flash-260828"
    models:
      "glm-5-3-flash-260828": {}
      "deepseek-v4-1-flash-261017": {}
  minimax-m3:
    name: "MiniMax-M3"
    api: "https://api.minimax.io/v1"
    key_env: MINIMAX_TOKEN_PLAN_KEY
    api_mode: chat_completions
    default_model: "MiniMax-M3"
  cursor-pool:
    name: "Cursor pool"
    api: "https://cursor-pool.invalid/v1"
    key_env: CURSOR_API_KEY
    api_mode: chat_completions
    default_model: "composer-2.5"
    enabled: false
agent:
  disabled_toolsets:
    - web
    - browser
    - terminal
    - file
    - code_execution
    - vision
    - video
    - image_gen
    - video_gen
    - x_search
    - tts
    - stt
    - skills
    - todo
    - kanban
    - memory
    - context_engine
    - session_search
    - connections
    - delegation
    - cronjob
    - yuanbao
    - computer_use
    - a2a
toolsets:
  - clarify
