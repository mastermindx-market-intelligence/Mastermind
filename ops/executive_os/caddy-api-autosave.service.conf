# Inactive, explicit opt-in drop-in for an API-managed Caddy service.
# See docs/OS_PUBLIC_EDGE_STARTUP.md before installing or activating it.
[Service]
ExecStart=
ExecStart=/usr/bin/caddy run --environ --config /var/lib/caddy/.config/caddy/autosave.json
ExecReload=
ExecReload=/usr/bin/caddy reload --config /var/lib/caddy/.config/caddy/autosave.json --force
