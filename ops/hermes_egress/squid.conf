# Source-only Squid 6/7 configuration for the one incumbent Hermes BYOK
# egress DATA PLANE. The host administrator must install and verify it.
# This is NOT an authorized service deployment or model credential store.
#
# Only two fixed CONNECT listeners, with disjoint vendor targets:
# mmsecretary => 127.0.0.2:18651 => ark.ap-southeast.bytepluses.com:443
# mmmeta      => 127.0.0.3:18652 => api.z.ai:443
#
# IMPORTANT: Same-UID clients can reach either proxy when systemd cgroup
# filtering is ineffective or a parent unit allows 127/8. Never infer role
# isolation from localip, myportname or config alone. The actual user service
# units must prove own-proxy permit, cross-proxy DENY and public direct DENY
# before credential enrollment. No other application may share these aliases.
#
# One host-owned proxy process, two role-specific listening sockets.
http_port 127.0.0.2:18651 name=hermes_secretary
http_port 127.0.0.3:18652 name=hermes_meta

# Match exactly one listener and exactly one DNS hostname for each role.
# A domain without a leading dot intentionally does not permit subdomains.
# -n forbids reverse-DNS matching of IP-literal CONNECT targets. A PTR record
# naming an allowed vendor is not permission to tunnel to that IP address.
acl secretary_socket myportname hermes_secretary
acl meta_socket myportname hermes_meta
acl secretary_vendor dstdomain -n ark.ap-southeast.bytepluses.com
acl meta_vendor dstdomain -n api.z.ai
acl tls_only port 443

# HTTP methods and all other port numbers are forbidden. Only encrypted
# CONNECT tunnel bytes pass through; Squid does not terminate provider TLS
# and never receives the provider API key in plaintext HTTP headers.
http_access deny !CONNECT
http_access deny !tls_only

# Block address-literal/private and sensitive destination IP ranges even if
# DNS for an allowlisted hostname is rebinding/misconfigured. The live host
# must still prove all actual resolved IPs and deny paths at the gateway.
acl forbidden_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 fc00::/7 fe80::/10
http_access deny forbidden_dst

http_access allow secretary_socket secretary_vendor CONNECT tls_only
http_access allow meta_socket meta_vendor CONNECT tls_only
http_access deny all

# Do not store HTTP response bodies (there are no HTTPS response bodies to
# see inside CONNECT). Access log includes CONNECT hostname, port and time,
# never headers, query bodies, credentials or the TLS-encrypted payload.
cache deny all
cache_mem 0 MB
cache_store_log none
pid_filename /run/hermes-egress/squid.pid
access_log stdio:/var/log/hermes-egress/access.log squid
cache_log /var/log/hermes-egress/cache.log
visible_hostname mastermind-hermes-egress
