# SOURCE PROPOSAL ONLY; existing service owner, sandbox and ReadWritePaths unchanged.
# Must be reviewed with the actual current service and same-host topology.
[Unit]
Requires=mastermind-research-citation.socket
After=mastermind-research-citation.socket

[Service]
Sockets=mastermind-research-citation.socket
ExecStart=
ExecStart=/opt/mastermind-research/venvs/@LOCK_SHA256@/bin/python -I -B /opt/mastermind-research/releases/@MASTERMIND_COMMIT@/scripts/mastermind_research_read_server.py --config /etc/mastermind/research-read-deployment.json --citation-unix --citation-socket-user __QUALIFIED_CADDY_UID__ --citation-socket-group __QUALIFIED_CADDY_GID__
